server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful

spring:
  application:
    name: shopping-cart-service
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      lettuce:
        pool:
          max-active: 32
          min-idle: 8
          max-idle: 16

mesh:
  environment: ${MESH_ENV:local}
  tier: edge
  tenant:
    required: false
    default-tenant: public
  cart:
    key-prefix: ${CART_KEY_PREFIX:cart:}
    # 14 days: long enough for an abandoned-but-returned session.
    ttl-minutes: ${CART_TTL_MINUTES:20160}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,redis
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://jaeger-collector.observability.svc.cluster.local:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.enterprise.mesh: ${LOG_LEVEL_APP:INFO}
