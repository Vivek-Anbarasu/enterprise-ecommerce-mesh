server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Fail fast rather than serving traffic with a half-initialised context.
  netty:
    connection-timeout: 5s

spring:
  application:
    name: api-gateway
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 25s
  cloud:
    gateway:
      server:
        webflux:
          # Everything from here down must live under `server.webflux`. Spring Cloud
          # Gateway 5 binds GatewayProperties to spring.cloud.gateway.server.webflux;
          # the old spring.cloud.gateway.routes key is no longer read by anything and
          # is not an error, it is simply dropped - so a config left at the old prefix
          # boots cleanly with zero routes and 404s everything.
          #
          # X-Forwarded-* are set by the mesh ingress; never trust client values.
          forwarded:
            enabled: true
            for-header: X-Forwarded-For
            proto-header: X-Forwarded-Proto
            host-header: X-Forwarded-Host
            x-forwarded-port-enabled: true
          # Preserve the caller's Host so downstream can build absolute URLs.
          preserve-host: false
          # Do not expose internal service hostnames in error payloads.
          include-exception-details: never
          x-forwarded:
            enabled: true
          # Regex matching proxies whose address may appear in X-Forwarded-For and
          # be ignored when resolving the client: Application Gateway's node
          # addresses, in this deployment.
          #
          # Two things change once this is set.
          #
          # 1. RateLimitKeyResolverConfig starts skipping these hops and returns
          #    the first untrusted one from the right. Unset, it still returns the
          #    rightmost hop - which is the one AGC appended from the address it
          #    really observed - so the result is already safe. Setting it makes
          #    that correct through more than one trusted hop as well.
          #
          # 2. Spring Cloud Gateway registers XForwardedHeadersFilter instead of
          #    RemoveXForwardedHeadersFilter, so X-Forwarded-* survives onto the
          #    outbound request and downstream services can still see the real
          #    client. Without this property those headers are stripped in hop.
          #
          # A regex over address strings, not CIDR - Spring matches it with
          # Pattern.matches against each hop. Anchor it: an unanchored pattern
          # matches hostnames and malformed values too, and a hop that is not an
          # address at all must not be silently trusted.
          trusted-proxies: ${EDGE_TRUSTED_PROXIES:^10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$}
          # NOTE: there is no global retry switch in Spring Cloud Gateway. The
          # `spring.cloud.gateway.retry.enabled` key this file used to carry binds to
          # nothing, so the gateway has never actually retried anything. Retries are
          # declared per route with the Retry filter, which is the right place for
          # them anyway - only idempotent requests should be retried, and that is a
          # per-route decision. Left as a known gap rather than a setting that looks
          # like it works.
          default-filters:
            # Hop-by-hop headers are stripped so internal topology is not leaked.
            #
            # Cookie is on that list deliberately, and the bff-service is why it
            # matters. The BFF terminates a browser session cookie and exchanges it for
            # a bearer token; if that cookie were forwarded, a server-side session
            # identifier - a bearer credential in everything but name - would travel to
            # every downstream service, where a log line, an error page or an SSRF
            # could capture it. Stripping it here means the credential never leaves the
            # edge that issued it. Everything downstream is authenticated by the token
            # alone.
            - RemoveRequestHeader=Cookie
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          # Downstream targets are plain http:// against Kubernetes Service DNS names.
          # There is no service registry: the mesh runs on AKS with CoreDNS for
          # name resolution and Istio for mTLS, retries and L7 routing, so the
          # gateway holds no registry in memory and sends no discovery heartbeats.
          # Client-side load balancing is therefore the cluster's job (kube-proxy or
          # Envoy), not the gateway's. Each *SVC_PORT matches the `port` of that
          # service's Kubernetes Service; MESH_*_URI still overrides the whole URI.
          #
          # Every route below is reachable by two kinds of caller. Direct clients -
          # mobile, partner integrations, curl - present a bearer token and are
          # charged against the limits below per tenant. The bff-service is also a
          # caller of these same routes, having converted a browser session cookie
          # into a bearer token first, so it is charged here too rather than being
          # exempt. That is the right accounting: an aggregation costing four gateway
          # calls is four calls' worth of load, and exempting the service that makes
          # them would simply hide it. What the BFF buys is that the shopper waits for
          # one round trip instead of four.
          routes:
            # ---------------- Read-heavy, anonymously browsable ----------------
            - id: product-catalog
              uri: ${MESH_CATALOG_URI:http://product-catalog-service:${CATALOG_SVC_PORT:8085}}
              predicates:
                - Path=/api/products/**,/api/categories/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: catalogCircuitBreaker
                    fallbackUri: forward:/fallback/catalog

            - id: review-rating
              uri: ${MESH_REVIEW_URI:http://review-rating-service:${REVIEW_SVC_PORT:8088}}
              predicates:
                - Path=/api/reviews/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: '#{@tenantKeyResolver}'
                    redis-rate-limiter.replenishRate: ${RL_READ_REPLENISH:200}
                    redis-rate-limiter.burstCapacity: ${RL_READ_BURST:400}
                    redis-rate-limiter.requestedTokens: 1

            # ---------------- Authenticated session traffic ----------------
            - id: customer
              uri: ${MESH_CUSTOMER_URI:http://customer-service:${CUSTOMER_SVC_PORT:8087}}
              predicates:
                - Path=/api/customers/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: '#{@tenantKeyResolver}'
                    redis-rate-limiter.replenishRate: ${RL_WRITE_REPLENISH:50}
                    redis-rate-limiter.burstCapacity: ${RL_WRITE_BURST:100}

            - id: shopping-cart
              uri: ${MESH_CART_URI:http://shopping-cart-service:${CART_SVC_PORT:8086}}
              predicates:
                - Path=/api/cart/**,/api/carts/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: '#{@tenantKeyResolver}'
                    redis-rate-limiter.replenishRate: ${RL_CART_REPLENISH:100}
                    redis-rate-limiter.burstCapacity: ${RL_CART_BURST:200}

            # ---------------- Checkout path: tight limits, must not be throttled
            # into abandonment, but must not melt inventory either ----------
            - id: order
              uri: ${MESH_ORDER_URI:http://order-service:${ORDER_SVC_PORT:8082}}
              predicates:
                - Path=/api/orders/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: '#{@tenantKeyResolver}'
                    redis-rate-limiter.replenishRate: ${RL_ORDER_REPLENISH:20}
                    redis-rate-limiter.burstCapacity: ${RL_ORDER_BURST:40}
                - name: CircuitBreaker
                  args:
                    name: orderCircuitBreaker
                    fallbackUri: forward:/fallback/orders

            # Customer-facing reads only at the edge. Authorise/capture/void/refund
            # are east-west calls from order-service, which talks to payment-service
            # directly, so they are deliberately not routable north-south. The
            # service still enforces SERVICE/ADMIN on those methods; this predicate
            # removes them from the public route entirely.
            - id: payment
              uri: ${MESH_PAYMENT_URI:http://payment-service:${PAYMENT_SVC_PORT:8084}}
              predicates:
                - Path=/api/payments/**
                - Method=GET
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: '#{@tenantKeyResolver}'
                    redis-rate-limiter.replenishRate: ${RL_PAYMENT_REPLENISH:20}
                    redis-rate-limiter.burstCapacity: ${RL_PAYMENT_BURST:40}
                - name: CircuitBreaker
                  args:
                    name: paymentCircuitBreaker
                    fallbackUri: forward:/fallback/payments
                # Payment reads share the gateway's connection pool with every
                # other route. The service still owns the card-network calls, but
                # a payment-service slowdown - DB, worker pool, or a card-network
                # event saturating workers - can pin gateway connections for the
                # full 8s breaker timeout. Cap concurrency so a degraded payment
                # read path cannot starve catalogue or cart.
                - name: Bulkhead
                  args:
                    name: paymentBulkhead
                    fallbackUri: forward:/fallback/payments

            # Stock lookup for the UI is a read. Reservations and receipts are
            # east-west calls from order-service (direct DNS) and stay off the
            # public edge; the service still enforces SERVICE/ADMIN on them.
            - id: inventory
              uri: ${MESH_INVENTORY_URI:http://inventory-service:${INVENTORY_SVC_PORT:8083}}
              predicates:
                - Path=/api/inventory/**
                - Method=GET
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: '#{@tenantKeyResolver}'
                    redis-rate-limiter.replenishRate: ${RL_INVENTORY_REPLENISH:100}
                    redis-rate-limiter.burstCapacity: ${RL_INVENTORY_BURST:200}

            # ---------------- Internal, mesh-only, never exposed publicly ------
            # notification-service is a Kafka worker with no business port
            # (server.port=-1); the only HTTP it serves is the actuator on the
            # management port, so this route reaches probes and metrics only.
            - id: notifications-internal
              uri: ${MESH_NOTIFICATION_URI:http://notification-service:${NOTIFICATION_SVC_PORT:8081}}
              predicates:
                - Path=/internal/notifications/**
              metadata:
                # Istio AuthorizationPolicy restricts this to the mesh ingress.
                exposure: internal

            # ---------------- Partner-facing webhooks (public path, authenticated) ---
            # Partner-facing carrier webhook. It lives under /api rather than
            # /internal because the waypoint's deny-internal-from-gateway policy
            # denies the gateway principal on /internal/*. The path is public but
            # authenticated: the gateway validates the carrier's bearer token and
            # shipping-delivery-service enforces ROLE_CARRIER.
            #
            # No Retry filter, deliberately. This is a POST status transition;
            # replaying it could apply the same carrier event twice. The carrier
            # owns retry, driven by the 503 + problem body from the fallback.
            - id: shipping-webhooks
              uri: ${MESH_SHIPPING_URI:http://shipping-delivery-service:${SHIPPING_SVC_PORT:8089}}
              predicates:
                - Path=/api/shipping/webhooks/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: shippingCircuitBreaker
                    fallbackUri: forward:/fallback/shipping
                # Inside the breaker, like the other bounded routes: an open
                # circuit sheds without spending a permit, and only a call that
                # is actually going downstream consumes one.
                - name: Bulkhead
                  args:
                    name: shippingBulkhead
                    fallbackUri: forward:/fallback/shipping

            - id: ai-orchestrator
              uri: ${MESH_AI_URI:http://ai-orchestrator-service:${AI_SVC_PORT:8090}}
              predicates:
                - Path=/api/ai/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: aiCircuitBreaker
                    fallbackUri: forward:/fallback/ai
                # Last in the list, so it sits inside the circuit breaker: an open
                # circuit sheds without spending a permit, and only a call that is
                # actually going downstream is capped. Listed after the circuit
                # breaker rather than before because the 30s aiCircuitBreaker timeout
                # is the whole problem - ten of those may run at once, and after that
                # the compartment is shut. Every further AI request is refused
                # outright, which leaves the catalogue, cart and checkout routes a
                # full gateway to serve from no matter how the orchestrator behaves.
                - name: Bulkhead
                  args:
                    name: aiBulkhead
                    fallbackUri: forward:/fallback/ai

            - id: swagger-ui
              uri: ${SWAGGER_UI_URI:http://localhost:8082}
              predicates:
                - Path=/internal/docs/**
              metadata:
                exposure: internal

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      catalogCircuitBreaker:
        baseConfig: default
      orderCircuitBreaker:
        baseConfig: default
        failureRateThreshold: 40
      paymentCircuitBreaker:
        baseConfig: default
        failureRateThreshold: 25
      aiCircuitBreaker:
        baseConfig: default
        waitDurationInOpenState: 30s
      # Low-volume partner route: waiting for the default 10 calls in a 20-call
      # window to observe a failing shipping service takes too long when carriers
      # send a handful of updates a minute. Trip after 5, fail fast with 503, and
      # let the carrier retry on its own schedule.
      shippingCircuitBreaker:
        baseConfig: default
        minimumNumberOfCalls: 5
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
        cancelRunningFuture: true
    instances:
      catalogCircuitBreaker:
        timeoutDuration: 3s
      orderCircuitBreaker:
        timeoutDuration: 10s
      paymentCircuitBreaker:
        timeoutDuration: 8s
      aiCircuitBreaker:
        timeoutDuration: 30s
      # Outer budget only. The waypoint's /api/ HTTPRoute also applies its 3s
      # per-attempt timeout in front of the service, so this is the backstop for
      # the gateway -> waypoint hop, not the normal path. It must stay above
      # shipping's own 5s Hikari connection timeout.
      shippingCircuitBreaker:
        timeoutDuration: 8s

  # Semaphore bulkheads, one compartment per route, capping how many requests
  # may be in flight against a given backend at the same time.
  #
  # These are a different control from the circuit breakers above and neither
  # replaces the other. The breaker bounds how long the gateway keeps retrying a
  # dependency that is failing; the bulkhead bounds how many callers may be
  # inside it while it is merely slow. Rate limiting does not cover this gap:
  # it caps arrivals per tenant per second, not how many of those arrivals may
  # be simultaneously holding a pooled connection waiting on one slow backend.
  #
  # Sizing is a capacity trade-off, so it is spelled out per instance below.
  # Two numbers to watch when retuning: maxConcurrentCalls, and the paired
  # breaker timeout, since together they set the worst-case throughput of the
  # route as maxConcurrentCalls / timeout.
  bulkhead:
    configs:
      default:
        # Reject, never queue. A queued request is still an open client socket
        # and still an open pooled connection, so queueing would recreate the
        # congestion it is meant to shed. Zero also matters for correctness
        # beyond throughput: BulkheadGatewayFilterFactory rejects at startup if
        # this is non-zero, because tryAcquirePermission() would then block the
        # Netty event-loop thread it runs on.
        maxWaitDuration: 0
    instances:
      aiBulkhead:
        baseConfig: default
        # 10 concurrent 30s calls is 20 AI requests/minute per gateway replica,
        # deliberately far below what the orchestrator could serve. Recommendations
        # are not what anyone came to buy, and the resource this protects is the
        # one catalogue and checkout both need. Raise it only together with
        # aiCircuitBreaker.timeoutDuration, or the compartment will just hand the
        # same pool exhaustion a longer fuse.
        maxConcurrentCalls: ${BULKHEAD_AI_MAX:10}
      paymentBulkhead:
        baseConfig: default
        # Sized above the 20/s payment rate limit because the bulkhead is global
        # across tenants while the rate limit is per tenant. It also bounds the
        # degraded case, which is the point: at the 8s breaker timeout this holds
        # checkout to roughly 3 in-flight payments per second when the card
        # network is slow, instead of letting that slowness spread into the pool
        # the cart and catalogue routes depend on. At a healthy 500ms it
        # comfortably clears the configured rate.
        maxConcurrentCalls: ${BULKHEAD_PAYMENT_MAX:25}
      shippingBulkhead:
        baseConfig: default
        # Bounds a carrier retry storm, and the shared connection pool it would
        # otherwise occupy. Sized for a partner replay backlog after an outage,
        # not for shopper traffic: the carrier gets 503 and retries rather than
        # the gateway queueing updates it cannot deliver.
        maxConcurrentCalls: ${BULKHEAD_SHIPPING_MAX:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          # Only contributors this service actually has. The gateway is stateless:
          # there is no DataSource on its classpath, so a 'db' entry here does not
          # merely report an unhealthy database - Spring Boot validates group
          # membership at startup and aborts the context with
          # "Health contributor 'db' ... does not exist", so the gateway would
          # never boot at all, and the Helm chart probes this exact group.
          include: readinessState,redis
        liveness:
          include: livenessState
  health:
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

mesh:
  environment: ${MESH_ENV:local}
  tier: edge

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.enterprise.mesh: ${LOG_LEVEL_APP:INFO}
    org.springframework.cloud.gateway: ${LOG_LEVEL_GATEWAY:INFO}
