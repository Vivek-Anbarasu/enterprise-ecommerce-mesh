# Scrape configuration for Azure Monitor managed service for Prometheus (AMP).
#
# Replaces the pod-annotation discovery in deploy/observability/prometheus/prometheus.yml,
# which only ever applied to the docker-compose stack. AMP does not read a
# prometheus.yml; it consumes PodMonitor custom resources, installed by the AKS
# metrics add-on alongside ama-metrics / ama-metrics-ksm / ama-metrics-node.
#
# Use the `azmonitoring.coreos.com` API group, not `monitoring.coreos.com`.
# The add-on installs the former; applying the latter fails on a missing CRD.
#
# Apply AFTER the add-on is enabled, otherwise the CRDs are absent:
#   az aks update -g <rg> -n <aks> \
#     --enable-azure-monitor-metrics \
#     --azure-monitor-workspace-resource-id <amw-id>
#
#   kubectl apply -f deploy/observability/amp/
#
# Why PodMonitor and not the old annotations: annotation-based discovery needs the
# scraper to be told to look, and it silently collects nothing when a pod forgets
# an annotation. A PodMonitor is a declaration that fails visibly if the target
# does not exist.
apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mesh-services
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: enterprise-ecommerce-mesh
spec:
  namespaceSelector:
    matchNames:
      - ecommerce
  # Selected by label rather than by the prometheus.io/scrape annotation the
  # deployments already carry, so it does not depend on a pod remembering an
  # annotation.
  selector:
    matchLabels:
      app.kubernetes.io/part-of: enterprise-ecommerce-mesh
  podMetricsEndpoints:
    # The business port. Headless services do not have this port; they expose
    # only `management` (8081) and are covered by `mesh-headless-services`
    # below. One endpoint cannot cover both because a PodMonitor endpoint is
    # matched by port name, not by falling back to the annotation.
    - port: http
      path: /actuator/prometheus
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
  # The label every alert rule and dashboard groups by. Carried through as a
  # scrape label so a series is attributable without joining back to the pod.
  relabelings:
    - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
      targetLabel: application
      action: replace
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace
      action: replace
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
      action: replace
    # Headless pods are covered by `mesh-headless-services`; drop them here so
    # they are not selected with a port they do not expose.
    - action: drop
      regex: "true"
      sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_headless]
---
# Headless services have no ClusterIP and expose only the management port
# (8081). The main monitor scrapes `port: http`, which these pods do not have,
# so they would otherwise be selected but never scraped successfully. The
# deployment template labels them `app.kubernetes.io/headless: "true"`, and the
# main monitor drops that label, so a pod is never scraped by both monitors.
apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mesh-headless-services
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: enterprise-ecommerce-mesh
spec:
  namespaceSelector:
    matchNames:
      - ecommerce
  selector:
    matchLabels:
      app.kubernetes.io/part-of: enterprise-ecommerce-mesh
      app.kubernetes.io/headless: "true"
  podMetricsEndpoints:
    - port: management
      path: /actuator/prometheus
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
  relabelings:
    - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
      targetLabel: application
      action: replace
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace
      action: replace
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
      action: replace
---
# ztunnel and waypoint must be scraped as their own targets.
#
# Ambient mode does NOT merge proxy metrics into the application's
# /actuator/prometheus. There is no sidecar to merge them, so a dashboard
# written for sidecar mode silently returns nothing after the migration. These
# selectors are the pods that carry the mesh's own telemetry.
#
# The waypoint is labelled `gateway.networking.k8s.io/gateway-name`, NOT
# `app.kubernetes.io/part-of`, so a selector on the application label never
# matches it. That is why these are two resources rather than one.
apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mesh-waypoint
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: enterprise-ecommerce-mesh
spec:
  namespaceSelector:
    matchNames:
      - ecommerce
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: waypoint
  podMetricsEndpoints:
    - port: http
      path: /stats/prometheus
      interval: 30s
      scrapeTimeout: 10s
  relabelings:
    # Ambient reports waypoint metrics with reporter="waypoint", where sidecar
    # mode used reporter="destination". Dashboards and recording rules have to
    # match on this value or they will select nothing.
    - targetLabel: reporter
      replacement: waypoint
      action: replace
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
      action: replace
---
# Kubernetes state metrics.
#
# AMP ships ama-metrics-ksm, which provides the kube-state-metrics series this
# platform's PodCrashLooping / NoHealthyReplicas rules need. That is why those
# rules were removed when the self-hosted stack was assessed: nothing produced
# the series. With the managed add-on they can come back — see
# deploy/observability/amp/rules/ and docs/RUNBOOK.md.
#
# Deliberately NOT declared here. ama-metrics-ksm is scraped by the default
# configuration that ships with the add-on, and redeclaring it risks a duplicate
# series with conflicting labels. This file is documentation, not a scrape job.
#
#   kube_pod_container_status_restarts_total
#   kube_deployment_status_replicas_available
#   kube_pod_container_resource_limits
