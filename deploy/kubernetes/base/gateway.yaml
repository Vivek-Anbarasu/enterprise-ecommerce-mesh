# API Gateway: the only workload exposed to the public internet.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: enterprise-ecommerce-mesh
data:
  SERVER_PORT: "8080"
  MESH_ENV: "aks-prod"
  # Downstream targets are plain http:// against Kubernetes Service DNS names.
  # There is no service registry in the gateway: CoreDNS resolves the names and
  # Istio provides mTLS and L7 routing, so the gateway keeps no registry in
  # memory and sends no discovery heartbeats. Instance selection is handled by
  # kube-proxy/Envoy. The short names must match the Service objects exactly.
  MESH_CATALOG_URI: "http://product-catalog-service:8085"
  MESH_REVIEW_URI: "http://review-rating-service:8088"
  MESH_CUSTOMER_URI: "http://customer-service:8087"
  MESH_CART_URI: "http://shopping-cart-service:8086"
  MESH_ORDER_URI: "http://order-service:8082"
  MESH_PAYMENT_URI: "http://payment-service:8084"
  MESH_INVENTORY_URI: "http://inventory-service:8083"
  MESH_AI_URI: "http://ai-orchestrator-service:8090"
  # Kafka worker: no business port, actuator management port only.
  MESH_NOTIFICATION_URI: "http://notification-service:8081"
  MESH_SHIPPING_URI: "http://shipping-delivery-service:8089"
  REDIS_HOST: "redis-cache.redis.svc.cluster.local"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.messaging.svc.cluster.local:9092"
  OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"
  LOG_FORMAT: "ecs"
  LOG_LEVEL_ROOT: "INFO"
  # The JWT verification key is mounted from Key Vault by the CSI driver.
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_PUBLIC_KEY_LOCATION: "file:/mnt/secrets/jwt/public-key.pem"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: enterprise-ecommerce-mesh
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the desired count, so capacity does not dip mid-deploy.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: enterprise-ecommerce-mesh
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: ecommerce-workload
      # Spread replicas so losing one node or zone cannot take the whole tier.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: acrenterprise.azurecr.io/ecommerce/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-gateway-config
          env:
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_PUBLIC_KEY_LOCATION
              valueFrom:
                secretKeyRef:
                  name: jwt-verification-key
                  key: public-key.pem
          volumeMounts:
            - name: jwt-key
              mountPath: /mnt/secrets/jwt
              readOnly: true
          # Probes use the dedicated management port so a saturated business
          # port cannot cause the kubelet to kill an otherwise healthy pod.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: jwt-key
          secret:
            secretName: jwt-verification-key
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: enterprise-ecommerce-mesh
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
