# Reference Kubernetes manifests.
#
# These are deliberately plain and complete so they can be read, audited and
# applied with plain `kubectl`. The Helm chart in deploy/helm is what you should
# actually use for a real deployment (it handles environments, rollouts and
# secret wiring properly), but these manifests document exactly what runs.
#
# Apply:
#   kubectl apply -k deploy/kubernetes/base
---
# Namespace with baseline security and resource enforcement.
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
  labels:
    app.kubernetes.io/part-of: enterprise-ecommerce-mesh
    # Ambient mode. This single label is what replaces the sidecar: the Istio
    # CNI agent captures every pod in the namespace and routes its traffic
    # through the shared ztunnel daemon on its node. There is no injector
    # webhook, no `istio-proxy` container and nothing to restart when the mesh
    # is upgraded.
    #
    # The previous value here was `istio-injection: disabled`, which opted the
    # namespace OUT of sidecar injection and therefore out of the mesh. That is
    # not the ambient equivalent: ambient wants the namespace IN, at L4, for
    # everything. Opting out is now done per pod with
    # `istio.io/dataplane-mode: none`, and there is no good reason to.
    istio.io/dataplane-mode: ambient
    # NOTE: `istio.io/use-waypoint` is deliberately NOT set here. Setting it on
    # the namespace would force every Service in the namespace through the L7
    # waypoint, including the Kafka-only workers that have nothing to parse.
    # Enrollment is per destination Service instead.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecommerce-workload
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: enterprise-ecommerce-mesh
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ecommerce-quota
  namespace: ecommerce
spec:
  hard:
    requests.cpu: "40"
    requests.memory: 80Gi
    limits.cpu: "80"
    limits.memory: 160Gi
    persistentvolumeclaims: "10"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ecommerce-default-pdb
  namespace: ecommerce
spec:
  # Never take a service below this many ready replicas during a node drain.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: enterprise-ecommerce-mesh
---
# Transport security for every pod in the namespace, enforced by ztunnel.
#
# STRICT, not the ambient default of PERMISSIVE: permissive silently accepts
# plaintext, so one misconfigured workload quietly loses transport encryption
# and nothing in the logs says so.
#
# DISABLE is not a usable option here. HBONE implies mTLS, so a DISABLE policy
# is ignored rather than honoured, and relying on it to carve out an exception
# would leave the workload silently encrypted instead.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default-strict-mtls
  namespace: ecommerce
spec:
  mtls:
    mode: STRICT
---
# One of two deliberate AGC-facing exceptions to STRICT above. The other is
# bff-service:8091, declared in bff-service.yaml.
#
# Application Gateway for Containers runs its data plane outside the cluster. It
# has no SPIFFE identity, does not speak HBONE, and cannot be given either, so a
# strict receiver refuses its traffic outright and no AuthorizationPolicy can
# rescue it: an unauthenticated peer cannot be authorized, only tolerated.
#
# The edge port is therefore PERMISSIVE. Everything east of the edge workloads -
# the checkout path above all - stays STRICT.
#
# `portLevelMtls` only takes effect when a selector is present, which is why
# this is a second, workload-scoped policy rather than a field on the one above.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: api-gateway-edge-port
  namespace: ecommerce
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  mtls:
    mode: STRICT
  portLevelMtls:
    # The workload port, not the Service port. Same value here by coincidence.
    8080:
      mode: PERMISSIVE
