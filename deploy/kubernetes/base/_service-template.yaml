# Reference Deployment + Service for one internal mesh service.
#
# This is a TEMPLATE: it documents the shape and the security posture applied to
# every service. It is not applied directly (the filename starts with an
# underscore and kustomize will not pick it up). Copy it per service, or use the
# Helm chart, which generates this for all ten services from one values file.
#
# Differences from the gateway, and why:
#   * No LoadBalancer/ingress - nothing but the gateway is internet-facing.
#   * resources: sized per tier, not one size fits all.
#
# There is deliberately NO sidecar container and no `sidecar.istio.io/inject`
# annotation. The namespace's `istio.io/dataplane-mode: ambient` label puts
# every pod in it behind the shared per-node ztunnel, which costs no pod memory
# and survives a mesh upgrade without restarting the application. The pod spec
# below is byte-for-byte the application container, nothing else.
#
# Port: each service listens on its own port, and the Service exposes that same
# port so the gateway can address it directly by DNS name with no registry:
#
#   order-service 8082            product-catalog-service 8085
#   inventory-service 8083        shopping-cart-service   8086
#   payment-service 8084          customer-service       8087
#                                 review-rating-service   8088
#                                 shipping-delivery-service 8089
#                                 ai-orchestrator-service 8090
#                                 notification-service    8081 (actuator only)
#
# Substitute SERVICE_PORT_PLACEHOLDER below with that service's port. Probes
# address the named port "http", so they follow automatically.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: SERVICE_NAME_PLACEHOLDER
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: SERVICE_NAME_PLACEHOLDER
    app.kubernetes.io/component: core
    app.kubernetes.io/part-of: enterprise-ecommerce-mesh
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: SERVICE_NAME_PLACEHOLDER
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: SERVICE_NAME_PLACEHOLDER
        app.kubernetes.io/component: core
        app.kubernetes.io/part-of: enterprise-ecommerce-mesh
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "SERVICE_PORT_PLACEHOLDER"
        # Roll pods when the config map changes, so an env change is not a
        # silent no-op until the next unrelated deploy.
        checksum/config: "REPLACED_BY_CI"
    spec:
      serviceAccountName: ecommerce-workload
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: SERVICE_NAME_PLACEHOLDER
      # Long enough for in-flight requests to drain and the saga to release
      # its stock holds.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: SERVICE_NAME_PLACEHOLDER
          image: acrenterprise.azurecr.io/ecommerce/SERVICE_NAME_PLACEHOLDER:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: SERVICE_PORT_PLACEHOLDER
          envFrom:
            - configMapRef:
                name: SERVICE_NAME_PLACEHOLDER-config
            - secretRef:
                name: database-credentials
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: SERVICE_NAME_PLACEHOLDER-db
                  key: url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: SERVICE_NAME_PLACEHOLDER-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: SERVICE_NAME_PLACEHOLDER-db
                  key: password
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { cpu: 1000m, memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # readOnlyRootFilesystem is on, so any writable path must be declared.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: SERVICE_NAME_PLACEHOLDER
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: SERVICE_NAME_PLACEHOLDER
    app.kubernetes.io/part-of: enterprise-ecommerce-mesh
    # Layer 7 enrollment. Drop this line and the service keeps working: it
    # falls back to the ztunnel L4 overlay, which is the correct default for
    # anything with no HTTP surface (a Kafka consumer) or that is only ever
    # reached from the edge (the gateway itself).
    #
    # Keep it for anything that needs request-level load balancing, retries,
    # outlier ejection or path-level authorization, which is every service the
    # gateway fans out to and the whole checkout path.
    istio.io/use-waypoint: waypoint
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: SERVICE_NAME_PLACEHOLDER
  ports:
    - name: http
      # Same as the container port: the gateway dials this directly by DNS name.
      port: SERVICE_PORT_PLACEHOLDER
      targetPort: http
---
# Bounds the blast radius of a bad deploy: at most one unavailable pod.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: SERVICE_NAME_PLACEHOLDER-pdb
  namespace: ecommerce
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: SERVICE_NAME_PLACEHOLDER
---
# HPA on CPU plus a floor on replicas. A minimum of 2 means a node drain can
# never reduce the service to zero ready pods.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: SERVICE_NAME_PLACEHOLDER-hpa
  namespace: ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: SERVICE_NAME_PLACEHOLDER
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      # React quickly to a traffic spike.
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # Scale down slowly; flapping costs more than a briefly oversized fleet.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
