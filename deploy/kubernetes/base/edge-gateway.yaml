# North-south edge: Azure Application Gateway for Containers (AGC).
#
# ingress-nginx reached end of life in March 2026 and the AKS application
# routing add-on that carries it is supported only until November 2026. This is
# AGC instead, expressed through Gateway API rather than the frozen Ingress API.
#
# Apply:
#   kubectl apply -k deploy/kubernetes/base
#
# AGC's data plane runs OUTSIDE the cluster. There is no ingress pod, no ingress
# namespace and no ingress ServiceAccount, which is why nothing below selects on
# one - and why the mesh policy has to authorize the edge by address.
#
# Prerequisites, all in docs/AKS-DEPLOYMENT.md:
#   * ALB Controller installed (helm or AKS add-on) -> GatewayClass
#     `azure-alb-external`
#   * Gateway API CRDs installed from the experimental channel
#   * An ApplicationLoadBalancer resource, or a BYO Application Gateway for
#     Containers whose resource ID you substitute below
#   * Secrets Store CSI driver, for the TLS certificate
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-edge
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: enterprise-ecommerce-mesh
  annotations:
    # ALB-managed: the controller creates and owns the Azure resources.
    # Substitute the names of your ApplicationLoadBalancer resource.
    alb.networking.azure.io/alb-name: PLACEHOLDER_ALB_NAME
    alb.networking.azure.io/alb-namespace: ecommerce
spec:
  gatewayClassName: azure-alb-external
  listeners:
    - name: https
      # Application Gateway for Containers only supports 80 and 443.
      port: 443
      protocol: HTTPS
      hostname: api.enterprise-ecommerce.com
      tls:
        # AGC performs the TLS offload. It cannot reference a Key Vault
        # certificate - its certificates must be a Secret inside the cluster -
        # so the previous `kubernetes.azure.com/tls-cert-keyvault-uri` Ingress
        # annotation has no equivalent here and would silently lose TLS.
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: api-gateway-tls
      allowedRoutes:
        # Same namespace only. The route below lives here too, so there is no
        # reason to widen this.
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-edge
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: enterprise-ecommerce-mesh
spec:
  parentRefs:
    - name: public-edge
      namespace: ecommerce
      sectionName: https
  rules:
    # The storefront SPA talks to the BFF, not to the gateway. Only these
    # prefixes are diverted; everything else - every existing mobile and partner
    # client - still lands on the gateway exactly as before.
    #
    # Routing by path rather than by hostname keeps this to one route and one
    # certificate. It also fails safe: an unrecognised SPA path falls through to
    # the gateway, which is what the SPA did before the BFF existed.
    - matches:
        - path:
            type: PathPrefix
            value: /bff
        # Spring Security's generated login page, which the BFF also serves.
        - path:
            type: PathPrefix
            value: /login
      backendRefs:
        - name: bff-service
          port: 8091
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api-gateway
          port: 8080
---
# Syncs the edge certificate from Key Vault into a Secret the Gateway can
# reference. Rotation stays a Key Vault operation; the certificate never enters
# git, an environment variable or etcd.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: api-gateway-tls
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: enterprise-ecommerce-mesh
spec:
  provider: azure
  refreshInterval: 1h
  secretObjects:
    - secretName: api-gateway-tls
      type: kubernetes.io/tls
      data:
        # Gateway API `tls.certificateRefs` expects exactly these two keys for
        # a kubernetes.io/tls Secret. Anything else is ignored and the listener
        # never reaches Programmed.
        - objectName: tls.crt
          key: tls.crt
        - objectName: tls.key
          key: tls.key
  parameters:
    # Cluster-specific: substitute, or use the Helm chart's keyVault values.
    tenantid: "PLACEHOLDER_TENANT_ID"
    vaultUrl: "PLACEHOLDER_VAULT_URI"
    objects: |
      array:
        - |
          objectName: tls.crt
          objectType: secret
          objectName: tls.crt
          keyName: PLACEHOLDER_EDGE_CERT_NAME
        - |
          objectName: tls.key
          objectType: secret
          objectName: tls.key
          keyName: PLACEHOLDER_EDGE_CERT_NAME
---
# Only Application Gateway for Containers may reach the gateway, so that a
# compromised in-cluster pod cannot bypass the WAF and the edge.
#
# ipBlocks rather than a namespaceSelector: AGC's data plane runs outside the
# cluster, so there is no namespace, pod or ServiceAccount to select on. The
# CIDR must match the ipBlocks in the `gateway-edge-only` AuthorizationPolicy
# rendered by deploy/helm/enterprise-ecommerce/templates/istio.yaml. If they
# disagree, one of the two silently wins and the edge either 503s or is open.
#
# Named `<service>-edge-only` to match what the Helm chart generates from the
# `edgeExposed` flag on each service. Note the AuthorizationPolicy above keeps
# the older `gateway-edge-only` name: the two are different resource kinds and
# only the NetworkPolicy was renamed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-edge-only
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: PLACEHOLDER_AGC_SUBNET_CIDR
      ports:
        - protocol: TCP
          port: 8080
    # Ambient terminates HBONE on 15008 and only then forwards to 8080, and
    # NetworkPolicy is evaluated on the host, before the tunnel is unwrapped.
    # Without this second rule the edge is cut off the moment the gateway joins
    # the mesh.
    #
    # Allowing 15008 does not open the gateway to AGC or to anything else: that
    # port speaks HBONE only, so a caller still has to present a mesh identity.
    - ports:
        - protocol: TCP
          port: 15008
---
# Default-deny for the whole namespace. This is the control that makes an
# accidental new Service on the wrong selector fail closed rather than open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ecommerce
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Kubelet health probes are the one thing a namespace-wide default-deny cannot
# express. They come from the node rather than from a pod, they are plaintext,
# and the node has no identity a policy could check.
#
# Ambient solves this by SNATing provably-local probe traffic to a link-local
# address and exempting exactly that address from mesh policy. A NetworkPolicy
# that denies ingress still blocks it, so these two addresses must be allowed
# explicitly or every pod fails readiness as soon as it joins the mesh.
#
# Both families are listed because an IPv4-only NetworkPolicy still applies to
# the IPv6 packets a dual-stack node pool sends.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-health-probes
  namespace: ecommerce
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
        - ipBlock:
            cidr: fd16:9254:7127:1337:ffff:ffff:ffff:ffff/128
---
# Explicitly re-allow DNS, which a default-deny would otherwise break and which
# every service needs to resolve service names.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: ecommerce
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53