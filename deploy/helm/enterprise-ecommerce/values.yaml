# Default values for the enterprise-ecommerce chart.
#
# Override per environment with -f values-prod.yaml. Anything secret is never
# set here: it is read from Key Vault through the CSI driver.

global:
  imageRegistry: acrenterprise.azurecr.io
  imagePullSecrets: []
  meshEnv: aks-prod
  logFormat: ecs
  logLevelRoot: INFO
  logLevelApp: INFO
  tracingSampleRate: "0.1"
  otlpEndpoint: http://jaeger-collector.observability.svc.cluster.local:4318/v1/traces
  # Shared by every service; used for rate limiting and tenant resolution.
  tenantDefault: public

  # Tenants this deployment serves. TenantContextFilter rejects anything else with
  # 403 before it reaches business logic.
  #
  # Left empty on purpose: the real tenant ids are environment-specific and are not
  # knowable from this repo. An empty list combined with `tenantAllowAll: true`
  # below means "no restriction at the filter-chain boundary" - a decision recorded
  # here rather than an omission. An empty list with `tenantAllowAll: false` is the
  # one combination that is refused: TenantAllowListSafetyCheck refuses to start
  # every service in a production-like environment, because "nobody configured this"
  # and "serve every tenant" are the same value and only one is a decision.
  #
  # Populate per environment, e.g. -f values-prod.yaml, or:
  #   --set global.mesh.tenantAllowed={acme,globex}
  #
  # Note when you do populate it: every service sets mesh.tenant.required=false with
  # default-tenant=public, so an anonymous request resolves to `public` and is then
  # checked against this list. A list of {acme,globex} would 403 the whole browsable
  # storefront. Include `public` unless the deployment is deliberately closed to
  # anonymous traffic, or set mesh.tenant.required=true per service as well.
  mesh:
    tenantAllowed: []
    tenantAllowAll: true

# ---------------------------------------------------------------------------
# Istio Ambient mode: ztunnel (shared L4) + optional waypoint (shared L7).
#
# Ambient removes the sidecar entirely. Every pod in the namespace is covered by
# the per-node ztunnel daemon, so mTLS and L4 identity cost no pod memory, need
# no injection webhook, and never restart an application when the mesh is
# upgraded. Layer 7 features are opt-in per service with `waypoint: true`.
# ---------------------------------------------------------------------------
istio:
  # ambient | none. Set to `none` for a cluster with no mesh installed; the
  # chart then renders no mesh policy at all.
  mode: ambient

  # Name of an OpenTelemetry provider defined in the istiod MeshConfig
  # `extensionProviders` block. Left empty by default so the chart renders
  # nothing that would be rejected by a control plane without that definition.
  # See docs/AKS-DEPLOYMENT.md for the Jaeger definition.
  tracingProvider: ""

  waypoint:
    # Required by any service flagged `waypoint: true`. Turning it off while
    # services are still enrolled silently drops them back to L4 only, because
    # ztunnel routes straight to the destination when no waypoint answers.
    enabled: true
    name: waypoint
    # `service` handles traffic addressed to a Kubernetes Service, which is what
    # the gateway and every microservice actually dial. `workload` would be
    # needed only for traffic sent to a pod IP, which this platform does not do.
    for: service
    replicas: 2
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { cpu: "1", memory: 1Gi }
    # A waypoint serves the whole namespace, so it is a shared dependency for
    # every enrolled service. Keep it above the PDB floor.
    pdb:
      minAvailable: 1

# Key Vault CSI driver integration. Secrets are mounted as files, so no secret
# ever appears in an environment variable or in etcd.
keyVault:
  enabled: false
  vaultUri: ""
  tenantId: ""
  objects: []

# ---------------------------------------------------------------------------
# Infrastructure endpoints. Managed services in AKS, containers locally.
# ---------------------------------------------------------------------------
infrastructure:
  postgres:
    host: ""
    port: 5432
  redis:
    host: redis-cache.redis.svc.cluster.local
    port: 6379
  kafka:
    bootstrapServers: kafka.messaging.svc.cluster.local:9092
  mongodb:
    uri: ""

# ---------------------------------------------------------------------------
# Shared probe defaults.
# ---------------------------------------------------------------------------
probes:
  startup:
    failureThreshold: 30
    periodSeconds: 5
  readiness:
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Individual services.
#
# `tier` selects sensible defaults for replicas and resources; override any
# field inline. `enabled: false` leaves a service out entirely, which is how a
# non-critical tier is removed from a smaller environment.
# ---------------------------------------------------------------------------
services:
  api-gateway:
    enabled: true
    tier: edge
    replicas: 3
    port: 8080
    # No waypoint. The gateway is the edge: its traffic arrives from the
    # ingress controller, and Istio models ingress-to-service separately from
    # east-west traffic, so it does not traverse the destination waypoint
    # anyway. Edge filtering (tenant resolution, rate limiting) stays in Spring
    # Cloud Gateway, where the business context lives. ztunnel still gives it
    # mTLS on every call it makes downstream.
    waypoint: false
    # Reachable from Application Gateway for Containers, and from nothing else.
    # Drives the edge NetworkPolicy. The gateway has always had one of these; the
    # flag is what replaced the hand-written policy that used to live in
    # templates/serviceaccount.yaml. Removing it silently deletes the network
    # control, because the default-deny still applies and nothing re-opens 8080.
    edgeExposed: true
    image:
      repository: api-gateway
      tag: ""            # defaults to .Chart.AppVersion
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
    # Rate limits, in requests per second per tenant.
    rateLimits:
      read:  { replenishRate: 200, burstCapacity: 400 }
      write: { replenishRate: 50,  burstCapacity: 100 }
      order: { replenishRate: 20,  burstCapacity: 40 }
    # `entra` carries the JWT decoder (issuer-uri + jwk-set-uri). Without it the
    # gateway starts but accepts no bearer tokens at all: every authenticated
    # route 401s while probes stay green. JwtValidationSafetyCheck turns that
    # into a startup failure in any production-like environment, so if this list
    # loses `entra` the pods crash-loop and say why, rather than serving nothing.
    profiles: ["production", "entra"]
    extraEnv:
      # Directory (tenant) id of the Entra app registration the BFF mints tokens
      # for. Must be the SAME tenant for both services: the gateway pins
      # issuer-uri to it, so a mismatch is a closed door rather than a silent one.
      ENTRA_TENANT_ID: "REPLACE_WITH_ENTRA_DIRECTORY_TENANT_ID"

  bff-service:
    enabled: true
    tier: edge
    replicas: 3
    port: 8091
    # No waypoint, for the same reason as the gateway: the BFF is entered by the
    # ingress controller, and Istio models ingress-to-service separately from
    # east-west traffic. What the BFF calls - the gateway - goes through ztunnel
    # for mTLS exactly as any other mesh call would.
    waypoint: false
    # Reachable from Application Gateway for Containers, and from nothing else.
    # This drives both the edge mTLS carve-out and the edge NetworkPolicy.
    edgeExposed: true
    # Own ServiceAccount, so the AuthorizationPolicy granting it access to the
    # api-gateway names one workload rather than the whole namespace.
    serviceAccount: true
    image: { repository: bff-service }
    # `entra` is the profile that carries the OAuth2 client registration. It is
    # separate from application.yml on purpose: an empty client-id is a startup
    # failure in Spring Boot, so the registration has to be either fully
    # configured or entirely absent.
    profiles: ["production", "entra"]
    resources:
      requests: { cpu: 250m, memory: 384Mi }
      limits: { cpu: "1", memory: 768Mi }
    # Reads ENTRA_CLIENT_SECRET from the <release>-bff-service-oauth Secret.
    # Empty for a public-client registration, which needs no secret.
    oauthClientSecret: false
    extraEnv:
      # The BFF's only route into the business mesh. Everything else it needs is
      # reachable from inside this service by way of the gateway.
      MESH_GATEWAY_URI: "http://api-gateway:8080"
      # Exact storefront origins, not a wildcard: this service reads a
      # SameSite-protected session cookie, so the CORS allow-list is a security
      # control here rather than a convenience.
      BFF_ALLOWED_ORIGINS: "https://shop.enterprise-ecommerce.com"
      # Must match the redirect URI registered on the Entra app registration.
      # The placeholder below is the public edge hostname from apiGateway; replace
      # it in values-prod.yaml alongside the frontend.
      ENTRA_CLIENT_ID: "REPLACE_WITH_ENTRA_APPLICATION_CLIENT_ID"
      ENTRA_TENANT_ID: "REPLACE_WITH_ENTRA_DIRECTORY_TENANT_ID"
      ENTRA_REDIRECT_URI: "https://shop.enterprise-ecommerce.com/bff/oauth2/callback/entra"
      # 30 minutes of idle time ends the session. Longer is friendlier and means a
      # stolen cookie is worth more, so this is the knob to turn when auditing.
      SESSION_TIMEOUT: "30m"
      SESSION_NAMESPACE: "bff:session"

  product-catalog-service:
    enabled: true
    tier: edge
    replicas: 3
    port: 8085
    # Read-heavy and fanned out by the gateway: needs L7 request-level
    # balancing so one hot pod is not pinned by a long-lived client connection.
    waypoint: true
    image: { repository: product-catalog-service }
    database: catalog
    mongodb: true
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
    # `entra` is what supplies the JwtDecoder, so the token this service receives
    # from the gateway is validated rather than trusted. MeshJwtValidationSafetyCheck
    # fails the pod at startup if `production` is active without a decoder, so
    # dropping `entra` here crash-loops the deployment instead of silently serving
    # 401s to every authenticated request.
    profiles: ["production", "entra"]
    extraEnv:
      # Directory (tenant) id of the Entra app registration. Must be the SAME
      # tenant for every service in the mesh: the gateway pins its issuer to it,
      # so a mismatch is a closed door rather than a silent one.
      ENTRA_TENANT_ID: "REPLACE_WITH_ENTRA_DIRECTORY_TENANT_ID"

  review-rating-service:
    enabled: true
    tier: edge
    replicas: 2
    port: 8088
    waypoint: true
    image: { repository: review-rating-service }
    database: reviews
    mongodb: true
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { cpu: 750m, memory: 768Mi }
    profiles: ["production", "entra"]
    extraEnv:
      ENTRA_TENANT_ID: "REPLACE_WITH_ENTRA_DIRECTORY_TENANT_ID"

  ai-orchestrator-service:
    enabled: true
    tier: edge
    replicas: 2
    port: 8090
    waypoint: true
    image: { repository: ai-orchestrator-service }
    database: ai
    mongodb: true
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
    profiles: ["production", "entra"]
    extraEnv:
      ENTRA_TENANT_ID: "REPLACE_WITH_ENTRA_DIRECTORY_TENANT_ID"
      AI_PROVIDER: none

  order-service:
    enabled: true
    tier: core
    replicas: 3
    port: 8082
    waypoint: true
    image: { repository: order-service }
    database: orders
    # Progressive rollout. `stable` and `canary` are the real Services the
    # waypoint balances between, selected by label rather than by a separate
    # registry. Disabled by default: with it off the chart renders a single
    # route to the one Service and there is no traffic split to reason about.
    canary:
      enabled: false
      weight: 5
      label: canary
    resources:
      requests: { cpu: 400m, memory: 768Mi }
      limits: { cpu: "2", memory: 1536Mi }
    profiles: ["production", "entra"]
    extraEnv:
      ENTRA_TENANT_ID: "REPLACE_WITH_ENTRA_DIRECTORY_TENANT_ID"
      RESERVATION_TTL_SECONDS: "900"

  payment-service:
    enabled: true
    tier: core
    replicas: 3
    port: 8084
    # Charged by this service. The waypoint gives request-level retries and
    # outlier ejection in front of it, so a stalling pod is pulled out of the
    # pool instead of timing out every shopper who reaches it.
    waypoint: true
    image: { repository: payment-service }
    database: payments
    resources:
      requests: { cpu: 300m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
    # `entra` is what makes common-security build its JwtDecoder. Without it this
    # pod has no way to validate the token the gateway forwards, and because
    # MESH_ENV is aks-prod, MeshJwtValidationSafetyCheck refuses to start - so it
    # crash-loops rather than serving. Same reason as every other service here.
    profiles: ["production", "entra"]
    extraEnv:
      ENTRA_TENANT_ID: "REPLACE_WITH_ENTRA_DIRECTORY_TENANT_ID"
      # MUST be overridden in production; the stub authorises anything.
      # PaymentGatewaySafetyCheck also refuses to start while this is `stub`.
      PAYMENT_GATEWAY: stub

  inventory-service:
    enabled: true
    tier: core
    replicas: 3
    port: 8083
    waypoint: true
    image: { repository: inventory-service }
    database: inventory
    resources:
      requests: { cpu: 350m, memory: 640Mi }
      limits: { cpu: "2", memory: 1280Mi }
    profiles: ["production", "entra"]
    extraEnv:
      ENTRA_TENANT_ID: "REPLACE_WITH_ENTRA_DIRECTORY_TENANT_ID"
      SWEEPER_INTERVAL_MS: "60000"

  shopping-cart-service:
    enabled: true
    tier: edge
    replicas: 3
    port: 8086
    waypoint: true
    image: { repository: shopping-cart-service }
    resources:
      requests: { cpu: 150m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
    profiles: ["production", "entra"]
    extraEnv:
      ENTRA_TENANT_ID: "REPLACE_WITH_ENTRA_DIRECTORY_TENANT_ID"
      CART_TTL_MINUTES: "20160"

  customer-service:
    enabled: true
    tier: core
    replicas: 2
    port: 8087
    waypoint: true
    image: { repository: customer-service }
    database: customers
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { cpu: 750m, memory: 768Mi }
    profiles: ["production", "entra"]
    extraEnv:
      ENTRA_TENANT_ID: "REPLACE_WITH_ENTRA_DIRECTORY_TENANT_ID"

  notification-service:
    enabled: true
    tier: async
    replicas: 2
    # No waypoint, and it has no HTTP business surface at all: a pure Kafka
    # consumer whose only endpoint is actuator for probes. L7 processing has
    # nothing to parse here, so it would be pure overhead. It still gets the
    # full ztunnel L4 treatment (mTLS, identity, L4 telemetry) for free.
    waypoint: false
    # Headless worker: no business HTTP port, only actuator.
    headless: true
    managementPort: 8081
    image: { repository: notification-service }
    resources:
      requests: { cpu: 150m, memory: 384Mi }
      limits: { cpu: 750m, memory: 768Mi }
    extraEnv:
      KAFKA_CONCURRENCY: "3"

  shipping-delivery-service:
    enabled: true
    tier: async
    replicas: 2
    port: 8089
    # Despite sitting on the async tier, this one DOES need a waypoint: it
    # exposes an /internal/shipping REST surface for carrier webhooks. Path
    # level authorisation of that surface is an L7 rule, and a rule ztunnel
    # cannot evaluate would be rejected as unsafe rather than ignored.
    waypoint: true
    image: { repository: shipping-delivery-service }
    database: shipping
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { cpu: 750m, memory: 768Mi }
    # This service exposes a real HTTP surface to carrier webhooks, so it is not
    # a headless worker and it must validate the forwarded token itself rather
    # than trusting the hop. `entra` builds the JwtDecoder; the module depends
    # on common-security for @EnableMethodSecurity and the startup safety check.
    profiles: ["production", "entra"]
    extraEnv:
      ENTRA_TENANT_ID: "REPLACE_WITH_ENTRA_DIRECTORY_TENANT_ID"

# ---------------------------------------------------------------------------
# North-south edge: Azure Application Gateway for Containers (AGC).
#
# Replaces ingress-nginx, whose upstream project reached end of life in March
# 2026. AGC is Azure-managed: the ALB Controller runs in-cluster but the data
# plane lives outside the cluster, so there is no proxy pod and no ingress
# namespace to secure.
#
# This is a Gateway API `Gateway`, not an `Ingress`. The Ingress API is frozen,
# AGC's Istio extension does not support ambient mode, and Gateway API is the
# same API the mesh's waypoint already uses.
# ---------------------------------------------------------------------------
apiGateway:
  enabled: true
  # Installed by the ALB Controller (helm chart or AKS add-on).
  gatewayClassName: azure-alb-external
  name: public-edge

  # Deployment strategy. Leave `albName`/`albNamespace` empty for BYO (you
  # created the Azure resources yourself) and set `albId`/`albFrontend`
  # instead. Exactly one of the two must be filled in.
  #
  # The defaults below are placeholders so that `helm template` and CI render
  # the chart out of the box. They name a resource that does not exist, so the
  # Gateway will not become Programmed until they point at a real
  # ApplicationLoadBalancer. Production overrides them in values-prod.yaml.
  albName: ecommerce-agc       # managed by the ALB Controller
  albNamespace: ecommerce
  albId: ""                   # BYO: resource ID of the Application Gateway for Containers
  albFrontend: ""             # BYO: name of its frontend

  listener:
    # AGC only supports 80 and 443. It does not listen on arbitrary ports.
    port: 443
    protocol: HTTPS
    hostname: api.enterprise-ecommerce.com

  # TLS.
  #
  # AGC cannot reference a Key Vault certificate directly: its certificates
  # must be a Kubernetes Secret inside the cluster. The Secrets Store CSI
  # driver syncs it from Key Vault on a schedule, so the certificate is still
  # rotated in Key Vault and never committed to source control.
  #
  # `secretName` must match the SecretProviderClass objectName in
  # templates/tls-certificate.yaml.
  certificate:
    secretName: api-gateway-tls
    # In-cluster Secret containing tls.crt / tls.key, synced from Key Vault.
    syncFromKeyVault: true

  # Source addresses the AGC data plane presents to backend pods. Consumed by
  # both the AuthorizationPolicy (ipBlocks) and the NetworkPolicy, because AGC
  # has no mesh identity to authorize by.
  #
  # SET THIS to the delegated AGC subnet. The placeholder below will not match
  # anything and every request will 503. Verify with:
  #   kubectl -n ecommerce logs deploy/ecommerce-api-gateway | head
  # or from a pod: conntrack / the api-gateway access log's source address.
  backendCidrs:
    - "10.0.0.0/24"

# ---------------------------------------------------------------------------
# Edge WAF: per-client-IP rate limiting, enforced before traffic reaches the
# cluster.
#
# This is the ONLY layer that still sees a real client IP for browser traffic.
# The api-gateway cannot do this job: once bff-service is in front, every
# anonymous storefront request arrives from a BFF pod address, so per-IP limiting
# at the gateway would pool every shopper in the world into one bucket. AGC
# terminates ahead of the BFF and still holds the true address.
#
# WAF on Application Gateway for Containers is two-sided and BOTH halves are
# required:
#   * deploy/bicep/waf-policy.bicep -> Azure policy + SecurityPolicy child
#     resource. Not a Kubernetes object, so no chart template can create it.
#   * templates/web-application-firewall.yaml -> this: which policy, what scope.
#
# Half of either is a silent no-op - AGC reports the policy as associated, but
# inspects no traffic and emits no firewall logs.
#
# Off by default because it depends on the Azure half existing first. Deploy the
# Bicep, take its output ID, then set enabled: true.
#
# The thresholds (limit and window) are parameters of the Bicep, not values here.
# This block carries only a reference and a scope, so the numbers have exactly
# one home and cannot drift.
# ---------------------------------------------------------------------------
webApplicationFirewall:
  enabled: false
  name: ""                # defaults to <release>-waf
  # ARM ID of the policy created by deploy/bicep/waf-policy.bicep. Must be in the
  # same subscription AND region as the Application Gateway for Containers
  # resource, or the association silently fails.
  policyResourceId: ""
  target:
    kind: Gateway
    # Empty inherits apiGateway.name. Overriding is a footgun: a typo yields a
    # policy that reports itself unattached rather than one that fails loudly.
    name: ""
    # Scope to a named listener, e.g. ["https"]. Empty covers the whole Gateway,
    # which is what you want unless a listener is deliberately excluded.
    sectionNames: []

# ---------------------------------------------------------------------------
# Platform components installed alongside the mesh.
# ---------------------------------------------------------------------------
observability:
  prometheus:
    enabled: true
    retention: 15d
  grafana:
    enabled: true
    adminUser: admin
  jaeger:
    enabled: true

# Guardrails applied to every generated workload.
podSecurity:
  runAsNonRoot: true
  runAsUser: 10001
  readOnlyRootFilesystem: true
  dropCapabilities: ["ALL"]
  seccompProfile: RuntimeDefault

networkPolicies:
  enabled: true
  defaultDeny: true

# ---------------------------------------------------------------------------
# Mesh-level traffic policy, enforced by the waypoint rather than by client
# code. A slow dependency can then not exhaust the caller's connection pool.
# ---------------------------------------------------------------------------
trafficPolicies:
  enabled: true
  # Whole-request budget across every try, and the budget for one attempt.
  timeout: 10s
  perTryTimeout: 3s
  retry:
    attempts: 2
    # Only 5xx that mean "the backend did not answer this request". 500 is
    # deliberately absent: it usually means the backend DID process the
    # request and failed afterwards, so replaying it is not free of charge.
    codes:
      - 502
      - 503
      - 504
    # ONLY idempotent verbs. Retrying POST /payments would charge a shopper
    # twice for a single order. The rule is split by method rather than
    # applied globally, because the gateway's clients are not all safe to
    # replay.
    methods:
      - GET
      - HEAD
      - OPTIONS

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1
