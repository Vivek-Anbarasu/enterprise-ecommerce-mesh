{{/*
Istio Ambient mode policy.

Rendered only when `istio.mode: ambient`, so the chart still installs against a
cluster with no mesh installed.

Ambient splits policy enforcement across TWO different proxies, and getting
this wrong fails closed or open depending on which mistake you make:

  * ztunnel (L4, per node) enforces policies that TARGET a workload with a
    `selector`. It understands only L4 attributes: principals, namespaces,
    ipBlocks, ports and the source/destination conditions. An L7 attribute
    (path, method, header) does not get ignored: ztunnel fails safe and turns
    the policy into a blanket DENY. So no selector-targeted policy in this
    file may contain an L7 attribute.

  * the waypoint (L7, per namespace) enforces policies ATTACHED with
    `targetRefs` to a Service or to the waypoint Gateway. Those are where the
    path and method rules live.

One more consequence worth stating plainly: ztunnel enforces on the RECEIVING
side of a connection. A namespace-wide ALLOW policy listing destination hosts
is therefore an ingress policy that happens to look like an egress policy, and
it provides no egress containment at all. Real egress control in this chart
comes from NetworkPolicy (templates/serviceaccount.yaml); hostname-level egress
control would need a waypoint deployed as an egress gateway, which this release
does not do.
*/}}
{{- if and .Values.istio (eq (.Values.istio.mode | default "none") "ambient") }}
{{- $root := . }}
{{- $ns := .Release.Namespace }}
{{- $wp := .Values.istio.waypoint }}
{{- $wpPrincipal := printf "cluster.local/ns/%s/sa/%s" $ns $wp.name }}
{{- $workloadPrincipal := printf "cluster.local/ns/%s/sa/%s-workload" $ns .Release.Name }}
{{- $gatewayPrincipal := printf "cluster.local/ns/%s/sa/%s-gateway" $ns .Release.Name }}
# ---------------------------------------------------------------------------
# 1. Transport security, enforced by ztunnel on every pod in the namespace.
# ---------------------------------------------------------------------------
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: {{ $ns }}
spec:
  mtls:
    # STRICT rather than PERMISSIVE, which is the ambient default. PERMISSIVE
    # silently accepts plaintext, so one misconfigured workload quietly loses
    # transport encryption with nothing in the logs to say so.
    mode: STRICT
{{- $gatewaySvc := index .Values.services "api-gateway" }}
{{- $bffSvc := index .Values.services "bff-service" }}
{{- if and .Values.apiGateway .Values.apiGateway.enabled $gatewaySvc.enabled }}
{{- if not $bffSvc }}
{{- fail "apiGateway routes /bff to services.bff-service; define that entry or set it enabled:false and pin apiGateway.bffPathPrefixes to [] ." }}
{{- end }}
{{- /*
The edge mTLS carve-out is per edge-exposed workload, not just the gateway. The
BFF is entered by the same Application Gateway for Containers data plane, which
runs outside the cluster with no SPIFFE identity to authenticate against, so the
same reasoning applies to it: it needs PERMISSIVE on its serving port, and
everything it calls stays STRICT.
*/}}
{{- range $edgeName, $edgeSvc := .Values.services }}
{{- if and $edgeSvc.enabled $edgeSvc.edgeExposed (ne $edgeName "api-gateway") }}
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: {{ $edgeName }}-edge-port
  namespace: {{ $ns }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $edgeName }}
      # `$`, not `.`: inside a range the dot is the loop item, so `.Release` is
      # nil here. `$` is the root context.
      app.kubernetes.io/instance: {{ $.Release.Name }}
  mtls:
    mode: STRICT
  portLevelMtls:
    {{ $edgeSvc.port }}:
      mode: PERMISSIVE
{{- end }}
{{- end }}
---
# The second deliberate AGC-facing exception to STRICT above. The other is
# generated by the edgeExposed loop above for bff-service:8091, when enabled.
#
# Application Gateway for Containers runs its data plane OUTSIDE the cluster.
# It has no SPIFFE identity, does not speak HBONE, and there is no mechanism to
# give it either. A strict receiver therefore refuses its traffic outright, and
# no AuthorizationPolicy can rescue it: an unauthenticated peer cannot be
# authorized, only tolerated.
#
# So the edge port is PERMISSIVE. Everything east of the edge workloads - which
# is where the trust actually matters, including the whole checkout path - stays
# STRICT and still refuses plaintext.
#
# `portLevelMtls` only takes effect when a selector is present, which is why
# this is a workload-scoped policy rather than a field on the namespace one.
# istiod compiles the pair into a ztunnel rule that rejects unauthenticated
# traffic to every port except this one.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: api-gateway-edge-port
  namespace: {{ $ns }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  mtls:
    mode: STRICT
  portLevelMtls:
    # The WORKLOAD port, not the Service port. They happen to be the same here
    # (8080), but that is a coincidence of this chart and not something to rely
    # on.
    {{ $gatewaySvc.port }}:
      mode: PERMISSIVE
{{- end }}
---
# ---------------------------------------------------------------------------
# 2. Authorization, L4. Every rule below uses only L4 attributes so that ztunnel
#    can actually enforce it.
# ---------------------------------------------------------------------------
# Deny everything not explicitly allowed. DENY policies are evaluated first, so
# an ALLOW rule can only ever narrow this further.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: default-deny
  namespace: {{ $ns }}
spec: {}
---
# Kubelet health probes are exempt from mesh policy: ambient SNATs them to a
# link-local address and skips enforcement for exactly that address, because
# the node has no identity a policy could check. No rule is needed here.
#
# The gateway is the one mesh workload with no waypoint of its own, so its
# ztunnel is the enforcement point. Unlike every other service it is entered by
# something that has no mesh identity at all, so it is authorized by source
# address rather than by principal.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-edge-only
  namespace: {{ $ns }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  action: ALLOW
  rules:
    # Application Gateway for Containers. ipBlocks is an L4 attribute so ztunnel
    # can enforce it, but it is addressing rather than identity, and AGC does not
    # spoof it. It must be kept in step with the NetworkPolicy of the same name;
    # a policy that allows one and not the other is a policy that does not work.
    {{- if and .Values.apiGateway .Values.apiGateway.enabled }}
    - from:
        - source:
            ipBlocks:
              {{- range $cidr := .Values.apiGateway.backendCidrs }}
              - {{ $cidr | quote }}
              {{- end }}
    {{- end }}
    - from:
        - source:
            namespaces: ["observability", "istio-system"]
    {{- if $bffSvc.enabled }}
    # The BFF is the one in-mesh workload permitted to call the gateway.
    #
    # It has to be named explicitly: the BFF converts a browser's session cookie
    # into a bearer token and then behaves like any other API client of the mesh,
    # so it needs to reach the gateway's /api routes. Every other business service
    # is reached through the gateway rather than around it, and a shared workload
    # principal would have handed that permission to all of them at once.
    #
    # This does not let the BFF reach any business service directly - that is the
    # gateway's route table - and the gateway re-validates the token regardless of
    # who presented it.
    - from:
        - source:
            principals:
              - {{ printf "cluster.local/ns/%s/sa/%s-bff-service" $ns .Release.Name }}
    {{- end }}
---
# The waypoint itself has to be able to reach the backends it balances across.
# Without this the waypoint's own egress is denied and every enrolled service
# fails, which looks like an application bug and is not one.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-waypoint-egress
  namespace: {{ $ns }}
  labels:
    {{- include "ecommerce.labels" (dict "root" $root "serviceName" "waypoint") | nindent 4 }}
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: {{ $wp.name }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - {{ $workloadPrincipal }}
              - {{ $gatewayPrincipal }}
---
# Prometheus scrapes /actuator/prometheus and the OTel Collector receives OTLP from every
# pod. Matching on namespace rather than principal keeps this working when the
# observability stack is deployed with a different service account.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-observability
  namespace: {{ $ns }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: enterprise-ecommerce-mesh
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["observability"]
---
# ---------------------------------------------------------------------------
# 3. Per-destination L4 policy.
#
#    Once a waypoint is in the path, the destination's ztunnel sees the
#    WAYPOINT's identity, not the original caller's: a waypoint does not
#    impersonate the source workload. So for an enrolled service the correct
#    L4 rule is "only the waypoint may reach me".
#
#    That is not just tidiness. `istio.io/use-waypoint` is a label recording
#    intent, and ztunnel routes straight to the destination if the waypoint is
#    missing or has no address. Without this rule, a waypoint outage would
#    silently downgrade to L4 with every L7 policy unenforced.
# ---------------------------------------------------------------------------
{{- range $name, $service := .Values.services }}
{{- if and $service.enabled $service.waypoint (not $service.headless) }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $name }}-require-waypoint
  namespace: {{ $ns }}
  labels:
    {{- include "ecommerce.labels" (dict "root" $root "serviceName" $name) | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - {{ $wpPrincipal }}
    # Waypoint administration and telemetry.
    - from:
        - source:
            namespaces: ["observability", "istio-system"]
{{- end }}
{{- if and $service.enabled (not $service.waypoint) }}
---
# No waypoint for this service, so its ztunnel is the enforcement point and the
# caller's identity is still visible at L4. {{ $name }} is reached directly by
# other mesh workloads.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $name }}-allow-mesh
  namespace: {{ $ns }}
  labels:
    {{- include "ecommerce.labels" (dict "root" $root "serviceName" $name) | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  action: ALLOW
  rules:
    {{- if $service.edgeExposed }}
    # Application Gateway for Containers, by address. This is the only thing
    # outside the cluster that may reach {{ $name }}: AGC runs its data plane
    # externally and has no SPIFFE identity to authorize by, so ipBlocks is the
    # only attribute available. The matching NetworkPolicy in
    # templates/serviceaccount.yaml uses the same CIDR list, and the two must
    # agree or one silently wins.
    {{- if and $root.Values.apiGateway $root.Values.apiGateway.enabled }}
    - from:
        - source:
            ipBlocks:
              {{- range $cidr := $root.Values.apiGateway.backendCidrs }}
              - {{ $cidr | quote }}
              {{- end }}
    {{- end }}
    {{- end }}
    - from:
        - source:
            principals:
              - {{ $workloadPrincipal }}
              - {{ $gatewayPrincipal }}
    - from:
        - source:
            namespaces: ["observability", "istio-system"]
{{- end }}
{{- end }}
{{- if $wp.enabled }}
---
# ---------------------------------------------------------------------------
# 4. Authorization, L7, enforced by the waypoint.
#
#    Attached to the Gateway so it covers every service the waypoint fronts, in
#    one place. A policy ATTACHED here is only enforced for traffic that
#    actually reaches the waypoint, which is why section 3 also pins the
#    waypoint's identity at L4.
# ---------------------------------------------------------------------------
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: waypoint-surface
  namespace: {{ $ns }}
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: {{ $wp.name }}
  action: ALLOW
  rules:
    - to:
        - operation:
            paths:
              - "/api/*"
              - "/internal/*"
              - "/actuator/health/*"
              - "/actuator/prometheus"
    # Admin and stats endpoints are reachable only from the control plane and
    # the observability stack, never from a shopping flow.
    - to:
        - operation:
            paths: ["/actuator/*"]
      from:
        - source:
            namespaces: ["observability", "istio-system"]
---
# The carrier webhook surface is internal-only. Stated as an explicit DENY
# rather than as an omission from the ALLOW above, so that widening the public
# surface later cannot silently reopen it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-internal-from-gateway
  namespace: {{ $ns }}
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: {{ $wp.name }}
  action: DENY
  rules:
    - from:
        - source:
            principals:
              - {{ $gatewayPrincipal }}
      to:
        - operation:
            paths: ["/internal/*"]
{{- if $root.Values.trafficPolicies.enabled }}
---
# ---------------------------------------------------------------------------
# 5. Traffic management, enforced by the waypoint.
#
#    Gateway API replaces the old VirtualService here. `VirtualService` with the
#    ambient data plane is Alpha, and Istio explicitly does not support mixing
#    it with Gateway API configuration, so the two must not coexist.
#
#    Outlier detection is not an HTTPRoute and is not a waypoint default; it
#    lives in templates/outlier-detection.yaml as a DestinationRule
#    trafficPolicy. Routing and retries stay here. See that file for why.
# ---------------------------------------------------------------------------
{{- $tp := $root.Values.trafficPolicies }}
{{- range $name, $service := .Values.services }}
{{- if and $service.enabled $service.waypoint (not $service.headless) }}
{{- /* dig, not `and`: `and` returns the last truthy argument rather than a
       bool, which ternary then rejects. Most services have no canary block at
       all, so the lookup has to tolerate a missing key. */}}
{{- $canary := dig "canary" "enabled" false $service }}
{{- range $r := (ternary (list "retry" "plain") (list "retry") $canary) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-resilience
  namespace: {{ $ns }}
  labels:
    {{- include "ecommerce.labels" (dict "root" $root "serviceName" $name) | nindent 4 }}
spec:
  parentRefs:
    # Attaching to the Service rather than the Gateway means the rule applies
    # to this destination only, and callers need no configuration at all.
    - group: ""
      kind: Service
      name: {{ $name }}
      port: {{ $service.port }}
  rules:
    {{- if eq $r "retry" }}
    # Idempotent verbs get the retry budget. This is the split the old
    # VirtualService only claimed to make: a single rule matching /api/ would
    # have retried POST /payments too, double-charging every shopper whose
    # payment provider returned a 503 after the charge had already been taken.
    - matches:
        {{- range $method := $tp.retry.methods }}
        - path:
            type: PathPrefix
            value: /api/
          method: {{ $method }}
        {{- end }}
      timeouts:
        request: {{ $tp.timeout }}
        backendRequest: {{ $tp.perTryTimeout }}
      # `retry` is an extended (experimental channel) Gateway API field, so the
      # CRDs must be installed from the experimental channel. The waypoint
      # install instructions already require that.
      retry:
        attempts: {{ $tp.retry.attempts }}
        codes:
          {{- range $code := $tp.retry.codes }}
          - {{ $code }}
          {{- end }}
        backoff: 250ms
    # Everything else keeps the timeout budget but is never replayed.
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      timeouts:
        request: {{ $tp.timeout }}
        backendRequest: {{ $tp.perTryTimeout }}
    {{- end }}
    {{- if $canary }}
    # Progressive rollout. `backendRefs` weights are the Gateway API equivalent
    # of the old DestinationRule subsets, and unlike a subset they can only
    # point at Services that really exist, so a typo fails at apply time rather
    # than silently sending all traffic to the wrong pool.
    #
    # One HTTPRoute per rule, because a rule matches at most one backend list;
    # splitting the two matching rules across two routes keeps the weighted
    # split identical for retried and non-retried traffic.
    {{- end }}
    {{- if $canary }}
    - backendRefs:
        - name: {{ $name }}-stable
          port: {{ $service.port }}
          weight: {{ sub 100 (int $service.canary.weight) }}
        - name: {{ $name }}-{{ $service.canary.label }}
          port: {{ $service.port }}
          weight: {{ int $service.canary.weight }}
    {{- else }}
    - backendRefs:
        - name: {{ $name }}
          port: {{ $service.port }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
---
# ---------------------------------------------------------------------------
# 6. Telemetry.
#
#    Ambient proxies emit this alongside the application's own OTel spans, so a
#    trace shows queueing and mTLS handshake time that Micrometer cannot see.
#    Two differences from sidecar mode that dashboards have to absorb:
#    waypoint metrics carry reporter="waypoint", and there is no metrics
#    merging, so Prometheus scrapes ztunnel and waypoint pods as separate
#    targets rather than through the application's own /actuator/prometheus.
# ---------------------------------------------------------------------------
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: mesh-access-logging
  namespace: {{ $ns }}
spec:
  accessLogging:
    - providers:
        - name: envoy
{{- if $root.Values.istio.tracingProvider }}
  tracing:
    # The provider must exist in the istiod MeshConfig `extensionProviders`
    # block; see deploy/istiod/meshconfig-tracing.yaml for the otel-collector
# definition. Referencing
    # a provider that is not defined leaves the resource rejected, so this is
    # driven by a value rather than hard-coded.
    - providers:
        - name: {{ $root.Values.istio.tracingProvider }}
      # Match the application's own sampling rate so the two halves of a trace
      # are not half-present.
      randomSamplingPercentage: {{ $root.Values.global.tracingSampleRate | float64 | mul 100 }}
{{- end }}
{{- end }}