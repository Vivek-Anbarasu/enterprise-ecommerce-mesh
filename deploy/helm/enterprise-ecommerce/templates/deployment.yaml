{{/*
Generates a Deployment, Service, PDB and HPA for every enabled service.

One template for all ten services rather than ten near-identical files: the
per-service differences are data (replicas, resources, ports), and expressing
them as values is what stops the manifests drifting apart over time.
*/}}
{{- $root := . }}
{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
{{- $fullName := printf "%s-%s" $root.Release.Name $name }}
{{- $isHeadless := $service.headless | default false }}
{{- $probePort := ternary ($service.managementPort | default 8081) $service.port $isHeadless }}
{{- $replicas := $service.replicas | default 2 }}
{{- /*
  Waypoint enrollment is a property of the DESTINATION, so it is declared on
  the Service rather than on the pod. Callers do not change and are not even
  aware: ztunnel rewrites the outbound connection and the waypoint does the L7
  work. A headless Service has no ClusterIP, so callers resolve pod IPs
  directly and a `service` waypoint could never intercept it; enrolling one
  would be a label that silently does nothing.
*/}}
{{- $ambient := eq ($root.Values.istio.mode | default "none") "ambient" }}
{{- $useWaypoint := and $ambient ($root.Values.istio.waypoint).enabled $service.waypoint (not $isHeadless) }}
{{- $canaryOn := and $service.canary $service.canary.enabled $useWaypoint }}
{{- /*
  The chart always deploys the STABLE revision. The canary Deployment is created
  out of band by copying this one and changing this label, which is why the
  value is fixed rather than read from `canary.enabled`.
*/}}
{{- $rollout := "stable" }}
{{- if and $root.Values.autoscaling.enabled (not $isHeadless) }}
{{- $replicas = $root.Values.autoscaling.minReplicas }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" (dict "root" $root "serviceName" $name) | nindent 4 }}
    app.kubernetes.io/component: {{ $service.tier | default "core" }}
  annotations:
    # Roll the pods when configuration changes, so an env edit is not a silent
    # no-op until some unrelated deploy happens to restart them.
    checksum/config: {{ toYaml $service.extraEnv | sha256sum }}
spec:
  {{- if not $root.Values.autoscaling.enabled }}
  replicas: {{ $replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "ecommerce.selectorLabels" (dict "root" $root "serviceName" $name) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Keep full capacity during a rollout: a zero-downtime deploy must not
      # reduce throughput while pods cycle.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "ecommerce.labels" (dict "root" $root "serviceName" $name) | nindent 8 }}
        app.kubernetes.io/component: {{ $service.tier | default "core" }}
        # Rollout slot. `stable` by default; a canary Deployment reuses the same
        # labels with this one changed, which is what the -stable and -canary
        # Services select on (see templates/canary.yaml).
        mesh.enterprise-ecommerce.io/rollout: {{ $rollout }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: {{ $probePort | quote }}
        {{- /*
          Ambient mode injects nothing into this pod: there is no sidecar
          container, so there is no `sidecar.istio.io/inject` annotation to set
          and no webhook to wait on at startup. Coverage comes from the shared
          per-node ztunnel, which the namespace label turns on for every pod.

          `none` is the explicit opt-out for a workload that must not be captured
          at all. It is off by default: opting a pod out loses mTLS and identity
          for that pod, so it should be a deliberate per-service decision.
        */}}
        {{- if and $root.Values.istio.mode (eq $root.Values.istio.mode "ambient") $service.dataplane }}
        istio.io/dataplane-mode: {{ $service.dataplane | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ $root.Release.Name }}-workload
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Long enough for in-flight requests to drain and for the checkout saga to
      # release any stock holds it still owns.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: {{ $root.Values.podSecurity.runAsNonRoot }}
        runAsUser: {{ $root.Values.podSecurity.runAsUser }}
        fsGroup: {{ $root.Values.podSecurity.runAsUser }}
        seccompProfile:
          type: {{ $root.Values.podSecurity.seccompProfile }}
      {{- if $root.Values.networkPolicies.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "ecommerce.selectorLabels" (dict "root" $root "serviceName" $name) | nindent 14 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "ecommerce.image" (dict "root" $root "service" $service) }}
          imagePullPolicy: IfNotPresent
          {{- if not $isHeadless }}
          ports:
            - name: http
              containerPort: {{ $service.port }}
          {{- else }}
          ports:
            - name: management
              containerPort: {{ $probePort }}
          {{- end }}
          env:
            {{- include "ecommerce.env" (dict "root" $root "service" $service "serviceName" $name) | nindent 12 }}
          {{- if $root.Values.keyVault.enabled }}
          volumeMounts:
            - name: keyvault-secrets
              mountPath: /mnt/secrets
              readOnly: true
            {{- if $root.Values.podSecurity.readOnlyRootFilesystem }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
          {{- else if $root.Values.podSecurity.readOnlyRootFilesystem }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ $probePort }}
            {{- toYaml $root.Values.probes.startup | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ $probePort }}
            {{- toYaml $root.Values.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ $probePort }}
            {{- toYaml $root.Values.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml $service.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ $root.Values.podSecurity.readOnlyRootFilesystem }}
            capabilities:
              drop: {{ toYaml $root.Values.podSecurity.dropCapabilities | nindent 16 }}
      volumes:
        {{- if $root.Values.keyVault.enabled }}
        - name: keyvault-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: keyvault-provider
        {{- end }}
        {{- if $root.Values.podSecurity.readOnlyRootFilesystem }}
        - name: tmp
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" (dict "root" $root "serviceName" $name) | nindent 4 }}
    {{- if $useWaypoint }}
    # Enrolls this destination in the shared waypoint. Requests from any pod in
    # the mesh addressed to this Service are then routed ztunnel -> waypoint ->
    # backend, which is what restores per-request load balancing, retries and
    # outlier ejection. Remove the label to drop back to the L4 overlay.
    istio.io/use-waypoint: {{ $root.Values.istio.waypoint.name }}
    {{- end }}
spec:
  # Headless (no ClusterIP) for Kafka consumers: the pods must not be load
  # balanced, because each consumer group member must own its partitions.
  {{- if $isHeadless }}
  type: ClusterIP
  clusterIP: None
  ports:
    - name: management
      port: {{ $probePort }}
      targetPort: management
  {{- else }}
  type: ClusterIP
  selector:
    {{- include "ecommerce.selectorLabels" (dict "root" $root "serviceName" $name) | nindent 4 }}
    {{- if $canaryOn }}
    # With a canary in play the plain Service must resolve to the stable pool
    # only. Leaving it unconstrained would let a direct caller (or a probe, or
    # a ServiceMonitor) reach the canary and quietly unbalance the split that
    # the HTTPRoute is supposed to own.
    mesh.enterprise-ecommerce.io/rollout: {{ $rollout }}
    {{- end }}
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: http
  {{- end }}
{{- if and $root.Values.autoscaling.enabled (not $isHeadless) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" (dict "root" $root "serviceName" $name) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullName }}
  minReplicas: {{ $root.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $root.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $root.Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $root.Values.autoscaling.targetMemoryUtilizationPercentage }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # Slow scale-down: flapping replicas cost more than briefly idle ones.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
{{- end }}
{{- if $root.Values.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullName }}-pdb
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" (dict "root" $root "serviceName" $name) | nindent 4 }}
spec:
  # Keeps the service above zero ready pods during a node drain or cluster upgrade.
  minAvailable: {{ $root.Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "ecommerce.selectorLabels" (dict "root" $root "serviceName" $name) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
