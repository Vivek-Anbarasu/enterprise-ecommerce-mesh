{{/*
Namespace-level platform objects: service accounts, quotas and network policy.

Generated by the chart so a fresh cluster gets the full guardrail set from a
single `helm install` rather than a checklist someone can forget.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-workload
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" (dict "root" . "serviceName" "workload") | nindent 4 }}
---
# Separate identity for the gateway so Istio AuthorizationPolicy can grant it
# access without granting every workload the same reach.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" (dict "root" . "serviceName" "api-gateway") | nindent 4 }}
{{- if and .Values.services (index .Values.services "bff-service") (index .Values.services "bff-service").enabled }}
---
# Separate identity for the BFF, for the same reason, and specifically because it
# is the only mesh workload allowed to call the api-gateway directly. The BFF turns
# a browser session cookie into a bearer token and calls the gateway like any other
# client, so the gateway has to recognise it - but naming its own principal keeps
# that permission from extending to every other pod in the namespace, which a
# shared `-workload` account would do.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-bff-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" (dict "root" . "serviceName" "bff-service") | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ .Release.Name }}-quota
  namespace: {{ .Release.Namespace }}
spec:
  hard:
    requests.cpu: "40"
    requests.memory: 80Gi
    limits.cpu: "80"
    limits.memory: 160Gi
    persistentvolumeclaims: "10"
{{- if .Values.networkPolicies.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
{{/*
Health probes are the one thing a namespace-wide default-deny cannot express.

Kubelet probes originate from the node, not from a pod, are plaintext, and the
node has no cryptographic identity the mesh could check. Ambient handles this by
SNATing provably-local probe traffic to a link-local address which it then
exempts from policy enforcement. A NetworkPolicy that denies ingress still
blocks it, so these two addresses must be allowed explicitly or every pod in the
namespace fails readiness the moment it joins the mesh.

These are not routable off the node by IETF standard, which is exactly why
ambient chose them.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-health-probes
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
        # Keep the IPv6 entry even on an IPv4-only cluster: dropping it breaks
        # probes on a dual-stack node pool, and AKS upgrades to dual stack
        # without warning.
        - ipBlock:
            cidr: fd16:9254:7127:1337:ffff:ffff:ffff:ffff/128
---
# A default-deny egress policy breaks DNS for every pod, which presents as an
# intermittent "service not found" that is hard to trace. Re-allow it explicitly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow intra-namespace service-to-service traffic, which is the common case.
# No `ports` clause, so this covers 15008 as well as the workload ports. In
# ambient mode every mesh-to-mesh connection arrives on 15008 regardless of the
# port the caller dialled, so a policy that listed only 8080 and friends would
# silently break all east-west traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: enterprise-ecommerce-mesh
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: enterprise-ecommerce-mesh
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: enterprise-ecommerce-mesh
    # DNS must be permitted even for same-namespace destinations.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Managed data services live outside the cluster, so the default-deny egress
# rule cuts them off. Without this, database and cache connections fail with a
# timeout that looks like a bad password rather than like a network policy.
#
# The addresses come from the same values the applications are configured with,
# so changing a host in one place cannot leave the policy pointing at the old
# address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-managed-data-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: enterprise-ecommerce-mesh
  policyTypes:
    - Egress
  egress:
    {{- with .Values.infrastructure.postgres.host }}
    - to:
        - ipBlock:
            cidr: {{ . }}
    {{- end }}
    {{- with .Values.infrastructure.redis.host }}
    - to:
        - ipBlock:
            cidr: {{ . }}
    {{- end }}
    # Service Bus, Key Vault and Monitor are public endpoints, and
    # NetworkPolicy cannot match a hostname. Those are covered by the DNS rule
    # above plus the Istio egress allow-list in templates/istio.yaml, which can
    # express hosts.
{{- if and .Values.apiGateway .Values.apiGateway.enabled }}
{{/*
Generated per service, not hand-written once per edge workload.

Any service flagged `edgeExposed: true` is reachable from Application Gateway for
Containers and from nowhere else. That is the whole point of the rule: a
compromised in-cluster pod must not be able to bypass the WAF and the edge by
dialling the edge workload directly.

ipBlocks rather than a namespaceSelector, because AGC's data plane runs outside
the cluster. There is no namespace, no pod and no ServiceAccount to select on -
the whole point of the managed service is that nothing of it lives here.

The CIDR must match apiGateway.backendCidrs, which the matching
AuthorizationPolicy in templates/istio.yaml also uses. If they disagree, one of
the two silently wins and the edge either 503s or is open.
*/}}
{{- range $name, $service := .Values.services }}
{{- if and $service.enabled $service.edgeExposed }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-edge-only
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" (dict "root" $ "serviceName" $name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range $cidr := $.Values.apiGateway.backendCidrs }}
        - ipBlock:
            cidr: {{ $cidr }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $service.port }}
    # Ambient terminates HBONE on 15008 and only then forwards to the application
    # port, and NetworkPolicy is evaluated on the host, before the tunnel is
    # unwrapped. Without this second rule the service is cut off the moment it
    # joins the mesh.
    #
    # Allowing 15008 does not open it to AGC or to anything else: that port speaks
    # HBONE only, so a caller still has to present a mesh identity, and the
    # AuthorizationPolicy in templates/istio.yaml still restricts who may connect.
    - ports:
        - protocol: TCP
          port: 15008
{{- end }}
{{- end }}
{{- end }}
