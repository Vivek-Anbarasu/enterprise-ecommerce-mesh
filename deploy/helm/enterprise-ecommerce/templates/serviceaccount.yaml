{{/*
Namespace-level platform objects: service accounts, quotas and network policy.

Generated by the chart so a fresh cluster gets the full guardrail set from a
single `helm install` rather than a checklist someone can forget.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-workload
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" (dict "root" . "serviceName" "workload") | nindent 4 }}
---
# Separate identity for the gateway so Istio AuthorizationPolicy can grant it
# access without granting every workload the same reach.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" (dict "root" . "serviceName" "api-gateway") | nindent 4 }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ .Release.Name }}-quota
  namespace: {{ .Release.Namespace }}
spec:
  hard:
    requests.cpu: "40"
    requests.memory: 80Gi
    limits.cpu: "80"
    limits.memory: 160Gi
    persistentvolumeclaims: "10"
{{- if .Values.networkPolicies.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# A default-deny egress policy breaks DNS for every pod, which presents as an
# intermittent "service not found" that is hard to trace. Re-allow it explicitly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow intra-namespace service-to-service traffic, which is the common case.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: enterprise-ecommerce-mesh
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: enterprise-ecommerce-mesh
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: enterprise-ecommerce-mesh
    # DNS must be permitted even for same-namespace destinations.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- $gatewayService := index .Values.services "api-gateway" }}
{{- if $gatewayService.enabled }}
---
# Only the ingress controller may reach the gateway, so a compromised in-cluster
# pod cannot bypass the edge.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress-only
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
{{- end }}
