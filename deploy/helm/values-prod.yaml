# Production values for the enterprise-ecommerce chart.
#
#   helm upgrade --install ecommerce deploy/helm/enterprise-ecommerce \
#     -n ecommerce --create-namespace -f deploy/helm/values-prod.yaml
#
# No secret values belong in this file or in any file under source control.
# Database credentials arrive from Key Vault via the CSI driver.

global:
  imageRegistry: acrenterprise.azurecr.io
  meshEnv: aks-prod
  logFormat: ecs
  logLevelRoot: INFO
  logLevelApp: INFO
  # 10% on request paths is enough to diagnose an incident without the storage
  # cost of full tracing.
  tracingSampleRate: "0.1"
  otlpEndpoint: http://jaeger-collector.observability.svc.cluster.local:4318/v1/traces
  tenantDefault: public
  imagePullSecrets:
    - name: acr-pull

istio:
  mode: ambient
  waypoint:
    enabled: true
    name: waypoint
    replicas: 3

keyVault:
  enabled: true
  # Tenant and vault URI are cluster-specific; set them via --set or an
  # environment-specific values file that is NOT committed.
  vaultUri: ""
  tenantId: ""

# ---------------------------------------------------------------------------
# Edge: Azure Application Gateway for Containers.
#
# ingress-nginx reached end of life in March 2026, so the north-south path is
# now AGC driven through Gateway API rather than through the frozen Ingress API.
# See docs/AKS-DEPLOYMENT.md for provisioning the ALB Controller.
# ---------------------------------------------------------------------------
apiGateway:
  enabled: true
  gatewayClassName: azure-alb-external
  name: public-edge
  # ALB-managed strategy: the controller creates the Azure resources from this
  # ApplicationLoadBalancer reference and owns their lifecycle.
  albName: ecommerce-agc
  albNamespace: ecommerce
  listener:
    port: 443
    protocol: HTTPS
    hostname: api.enterprise-ecommerce.com
  certificate:
    secretName: api-gateway-tls
    syncFromKeyVault: true
  # MUST match the delegated AGC subnet. AGC has no mesh identity, so this is
  # the only thing restricting who may reach the gateway besides the WAF.
  # The placeholder below is deliberately not a real subnet: leaving it
  # unedited produces a gateway that answers nothing.
  backendCidrs:
    - "10.0.1.0/24"

infrastructure:
  postgres:
    host: ""
    port: 5432
  redis:
    host: ecommerce-cache.redis.cache.windows.net
    port: 6380
  kafka:
    # Azure Service Bus Kafka-compatible endpoint. Prefer this over an in-cluster
    # Kafka: broker state leaves the cluster and reserved throughput is explicit.
    bootstrapServers: "ecommerce.servicebus.windows.net:9093"
  mongodb:
    uri: ""

services:
  # Every service below that depends on common-security validates the forwarded
  # token against this directory, so it has to be set for all of them - not just
  # the gateway and BFF. The value is identical across the mesh by design: they
  # all pin issuer-uri to one directory, so there is exactly one place to get it
  # wrong. A service left unset here crash-loops at startup naming the missing
  # value, rather than starting up and rejecting every authenticated request.
  #
  # Supply it with --set for all of them in one go, e.g.
  #
  #   for s in product-catalog review-rating ai-orchestrator order payment \
  #            inventory shopping-cart customer; do
  #     --set services.$s-service.extraEnv.ENTRA_TENANT_ID=<directory-id>
  #   done
  #
  # or from an environment-specific values file kept out of source control. It
  # identifies a real Entra directory, which is why it is not committed.

  api-gateway:
    replicas: 3
    extraEnv:
      # Same directory as the bff-service below, and it must be the same: the
      # gateway pins issuer-uri to this tenant, so a mismatch means it rejects
      # every token the BFF mints. Left empty here rather than committed, because
      # this identifies a real Entra directory. Supply it with --set or from an
      # environment-specific values file kept out of source control:
      #
      #   --set services.api-gateway.extraEnv.ENTRA_TENANT_ID=<directory-id>
      #
      # JwtValidationSafetyCheck refuses to start the pod if this is empty or still
      # a REPLACE_ placeholder while the entra profile is active, so leaving it
      # unset is a crash-loop with an explanatory message rather than a gateway
      # that quietly rejects the whole world's tokens.
      ENTRA_TENANT_ID: ""

  bff-service:
    replicas: 4
    # Reads ENTRA_CLIENT_SECRET from the <release>-bff-service-oauth Secret.
    # Set true only for a confidential client registration. A public client using
    # PKCE needs no secret and is the better default for a browser-facing app:
    # nothing to leak, rotate, or accidentally log.
    oauthClientSecret: false
    extraEnv:
      # Cluster-specific, and deliberately left empty here: these identify a real
      # Entra directory and must not be committed. Supply them with --set, or from
      # an environment-specific values file kept out of source control:
      #
      #   --set services.bff-service.extraEnv.ENTRA_TENANT_ID=<directory-id> \
      #   --set services.bff-service.extraEnv.ENTRA_CLIENT_ID=<app-client-id>
      #
      # Nothing else about the BFF is environment-specific.
      ENTRA_TENANT_ID: ""
      ENTRA_CLIENT_ID: ""
      # Must match the redirect URI registered on the Entra app registration
      # exactly, scheme and path included.
      ENTRA_REDIRECT_URI: "https://api.enterprise-ecommerce.com/bff/oauth2/callback/entra"
      # 30 minutes idle. This is also the blast radius of a stolen session cookie,
      # so it is the knob to turn down if the threat model calls for it.
      SESSION_TIMEOUT: "30m"

  product-catalog-service:
    replicas: 4
    extraEnv:
      ENTRA_TENANT_ID: ""

  review-rating-service:
    extraEnv:
      ENTRA_TENANT_ID: ""

  ai-orchestrator-service:
    replicas: 2
    extraEnv:
      ENTRA_TENANT_ID: ""
      AI_PROVIDER: none

  shopping-cart-service:
    replicas: 4
    extraEnv:
      ENTRA_TENANT_ID: ""

  customer-service:
    extraEnv:
      ENTRA_TENANT_ID: ""

  inventory-service:
    replicas: 4
    extraEnv:
      ENTRA_TENANT_ID: ""
      SWEEPER_INTERVAL_MS: "30000"
      SWEEPER_BATCH_SIZE: "500"

  order-service:
    replicas: 4
    extraEnv:
      ENTRA_TENANT_ID: ""
      # 15 minutes is long enough for a shopper to complete payment and short
      # enough that abandoned holds release quickly under peak load.
      RESERVATION_TTL_SECONDS: "900"

  payment-service:
    replicas: 4
    extraEnv:
      ENTRA_TENANT_ID: ""
      # MUST be overridden here. The stub authorises any non-decline token and
      # must never reach production; the service refuses to start otherwise.
      PAYMENT_GATEWAY: production

  notification-service:
    replicas: 3
    extraEnv:
      # Consumer concurrency is capped by partition count, so this must stay at
      # or below order.events partitions.
      KAFKA_CONCURRENCY: "6"

  shipping-delivery-service:
    replicas: 2

# Tighter autoscaling for the critical checkout path; the AI tier is left
# conservative because it is optional.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

pdb:
  enabled: true
  minAvailable: 1

observability:
  prometheus:
    enabled: true
    retention: 30d
  grafana:
    enabled: true
  jaeger:
    enabled: true
