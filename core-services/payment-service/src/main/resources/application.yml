server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

spring:
  application:
    name: payment-service
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:15}
      minimum-idle: 3
      connection-timeout: 5000
      data-source-properties:
        statement_timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  # No kafka block on purpose: this service has no @KafkaListener and no EventPublisher.
  # Payment calls are synchronous REST from order-service, deliberately - a checkout
  # must know whether it was authorised, not discover it later. See the note in
  # ai-orchestrator-service on why the block is absent rather than merely unused.

mesh:
  environment: ${MESH_ENV:local}
  tier: core
  tenant:
    required: false
    default-tenant: public
  payment:
    # 'stub' is for local/dev only and simulates payments without taking money.
    # 'http' is the real provider integration (see HttpPaymentGateway for the
    # contract it speaks). Anything else fails startup by name.
    gateway: ${PAYMENT_GATEWAY:stub}
    provider:
      # Required when gateway=http. Supplied from a Kubernetes secret; the api key
      # must never be committed to values.yaml.
      base-url: ${PAYMENT_PROVIDER_BASE_URL:}
      api-key: ${PAYMENT_PROVIDER_API_KEY:}
  clients:
    order: ${ORDER_URI:http://order-service:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db,kafka
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://jaeger-collector.observability.svc.cluster.local:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.enterprise.mesh: ${LOG_LEVEL_APP:INFO}
