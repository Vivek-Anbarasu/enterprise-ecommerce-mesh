server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
    accept-count: 100

spring:
  application:
    name: order-service
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 5000
      data-source-properties:
        statement_timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Azure Event Hubs exposes the Kafka API only over SASL_SSL on :9093. The
    # defaults keep local Docker Kafka working; production sets these from Helm.
    # The JAAS string is a credential and arrives from a Kubernetes Secret.
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    ssl:
      trust-store-location: ${KAFKA_TRUSTSTORE_LOCATION:}

mesh:
  environment: ${MESH_ENV:local}
  tier: core
  tenant:
    required: false
    default-tenant: public
  # No outbox relay settings: rows are inserted in the order transaction and
  # Debezium streams them out of the WAL. There is nothing to poll or batch here.
  saga:
    reservation-ttl-seconds: ${RESERVATION_TTL_SECONDS:900}
    # Remote-call budgets. Without these the saga's RestClient waits forever on a
    # hung participant, and because checkout is synchronous so does the shopper.
    connect-timeout: ${SAGA_CONNECT_TIMEOUT:2s}
    read-timeout: ${SAGA_READ_TIMEOUT:5s}
    # Must exceed the worst case of all steps (roughly four read timeouts). Past
    # this, the claim is stale and StaleSagaSweeper fails the checkout.
    claim-lease: ${SAGA_CLAIM_LEASE:120s}
    # Retries for compensating actions that did not land when the checkout failed.
    compensation:
      enabled: ${SAGA_COMPENSATION_ENABLED:true}
      interval-ms: ${SAGA_COMPENSATION_INTERVAL_MS:30000}
      batch-size: ${SAGA_COMPENSATION_BATCH_SIZE:50}
      base-delay-seconds: ${SAGA_COMPENSATION_BASE_DELAY_SECONDS:30}
      max-delay-seconds: ${SAGA_COMPENSATION_MAX_DELAY_SECONDS:900}
      lease-seconds: ${SAGA_COMPENSATION_LEASE_SECONDS:60}
    # Fails checkouts whose orchestrator died mid-flight, then compensates.
    recovery:
      enabled: ${SAGA_RECOVERY_ENABLED:true}
      interval-ms: ${SAGA_RECOVERY_INTERVAL_MS:60000}
      batch-size: ${SAGA_RECOVERY_BATCH_SIZE:50}
  clients:
    inventory: ${INVENTORY_URI:http://inventory-service:8083}
    payment: ${PAYMENT_URI:http://payment-service:8084}

# These two breakers are the saga's, wired by SagaClientConfig. Kept in config
# rather than built in code so the failure thresholds are visible next to the
# timeouts they complement. A 409 from inventory (sold out) does not count as a
# failure - only transport errors and 5xx do.
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
    instances:
      inventoryCircuitBreaker:
        baseConfig: default
      paymentCircuitBreaker:
        baseConfig: default
        failureRateThreshold: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        # Kafka is `optional:` because an order can still be written and its
        # event queued to the outbox while the broker is unavailable. Failing
        # readiness in that window would pull every checkout replica out of the
        # Service and turn a partial outage into a total one.
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
      validate-group-membership: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.enterprise.mesh: ${LOG_LEVEL_APP:INFO}
