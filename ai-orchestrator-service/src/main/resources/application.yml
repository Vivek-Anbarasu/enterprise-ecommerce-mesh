server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful

spring:
  application:
    name: ai-orchestrator-service
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ai_db}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
  cache:
    type: redis
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:ai-orchestrator}
      auto-offset-reset: earliest

mesh:
  environment: ${MESH_ENV:local}
  tier: edge
  tenant:
    required: false
    default-tenant: public
  clients:
    catalog: ${CATALOG_URI:http://product-catalog-service:8085}
  ai:
    # When no model provider is configured the service falls back to the
    # transparent heuristic in RecommendationService.
    provider: ${AI_PROVIDER:none}
    max-recommendations: ${AI_MAX_RECOMMENDATIONS:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,mongo
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.05}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://jaeger-collector.observability.svc.cluster.local:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.enterprise.mesh: ${LOG_LEVEL_APP:INFO}
