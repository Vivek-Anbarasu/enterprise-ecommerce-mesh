apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger-collector.observability.svc.cluster.local:14268
    jsonData:
      tracesToLogsV2:
        datasourceUid: Prometheus
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        tags: [{ key: "service.name", value: "app" }]
      nodeGraph:
        enabled: true
