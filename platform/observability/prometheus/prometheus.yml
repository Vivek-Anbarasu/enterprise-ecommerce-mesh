# Prometheus scrape configuration — LOCAL DEVELOPMENT ONLY.
#
# This file is mounted by docker-compose.yml and is read by nothing in AKS.
# Production metrics go to Azure Monitor managed service for Prometheus, which
# consumes the PodMonitor and PrometheusRule objects in
# platform/observability/amp/ and does not read a prometheus.yml at all.
#
# Kept because the local stack is genuinely useful and still works. It is not a
# description of the production system and must not be edited as if it were.
#
# The recording and alerting rules that used to sit alongside this file have moved
# to platform/observability/amp/rules.yaml. They are NOT duplicated here: a rule
# defined in two places drifts, and the copy nobody remembers is the one that
# silently stops matching. Local development therefore has metrics and dashboards
# but no alerting, which is the right trade for a dev stack.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    cluster: ecommerce-local
    environment: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Business services.
  - job_name: mesh-services
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [ecommerce]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      # Carry these as scrape labels so every series is attributable.
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: replace
        target_label: application
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        action: replace
        target_label: component
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod

  # Kubernetes control-plane metrics for capacity planning.
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
