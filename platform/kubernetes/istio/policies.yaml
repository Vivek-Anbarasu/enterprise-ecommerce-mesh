---
# shipping-delivery-service IS enrolled. It sits on the async tier and spends
# its life consuming Kafka, but it also exposes /internal/shipping for carrier
# webhooks, and path-level authorization of that surface is an L7 rule. Leaving
# it on L4 alone would mean either losing the rule or having ztunnel reject it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: shipping-delivery-service-require-waypoint
  namespace: ecommerce
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: shipping-delivery-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/ecommerce/sa/waypoint"
    - from:
        - source:
            namespaces: ["observability", "istio-system"]
---
# notification-service is NOT enrolled. It is a pure Kafka consumer with no
# HTTP business surface, so L7 has nothing to parse and its ztunnel is the
# enforcement point. The caller's real identity is still visible here.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: notification-service-allow-mesh
  namespace: ecommerce
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/ecommerce/sa/ecommerce-workload"
              - "cluster.local/ns/ecommerce/sa/ecommerce-gateway"
    - from:
        - source:
            namespaces: ["observability", "istio-system"]
---
# ---------------------------------------------------------------------------
# Layer 7. Attached to the Gateway, so one pair of rules covers every service
# the waypoint fronts.
#
# An attached policy is only enforced for traffic that actually reaches the
# waypoint. The L4 "require-waypoint" rules above are what makes that guarantee
# rather than a hope.
# ---------------------------------------------------------------------------
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: waypoint-surface
  namespace: ecommerce
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: waypoint
  action: ALLOW
  rules:
    - to:
        - operation:
            paths:
              - "/api/*"
              - "/internal/*"
              - "/actuator/health/*"
              - "/actuator/prometheus"
    # Admin endpoints stay closed to shopping traffic.
    - to:
        - operation:
            paths: ["/actuator/*"]
      from:
        - source:
            namespaces: ["observability", "istio-system"]
---
# The carrier webhook surface is internal-only. Stated as an explicit DENY
# rather than as an omission from the ALLOW above, so widening the public
# surface later cannot silently reopen it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-internal-from-gateway
  namespace: ecommerce
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: waypoint
  action: DENY
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/ecommerce/sa/ecommerce-gateway"
      to:
        - operation:
            paths: ["/internal/*"]
---
# ---------------------------------------------------------------------------
# Traffic management.
#
# Gateway API replaces the VirtualService that used to live here. VirtualService
# with the ambient data plane is Alpha, and Istio explicitly does not support
# mixing it with Gateway API configuration, so the two must not coexist.
# ---------------------------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: order-service-resilience
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: order-service
spec:
  parentRefs:
    # Attaching to the Service rather than the Gateway means the rule applies to
    # this destination only, and callers need no configuration at all.
    - group: ""
      kind: Service
      name: order-service
      port: 8082
  rules:
    # Idempotent verbs get the retry budget. This is the split the old
    # VirtualService only claimed to make: a single rule matching /api/ would
    # have retried POST /payments too, charging a shopper twice for one order
    # whenever the provider answered 503 after the charge had already been
    # taken.
    - matches:
        - path:
            type: PathPrefix
            value: /api/
          method: GET
        - path:
            type: PathPrefix
            value: /api/
          method: HEAD
        - path:
            type: PathPrefix
            value: /api/
          method: OPTIONS
      backendRefs:
        - name: order-service
          port: 8082
      timeouts:
        request: 10s
        backendRequest: 3s
      # `retry` is an extended (experimental channel) Gateway API field.
      retry:
        attempts: 2
        codes:
          - 502
          - 503
          - 504
        backoff: 250ms
    # Everything else keeps the timeout budget but is never replayed.
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - name: order-service
          port: 8082
      timeouts:
        request: 10s
        backendRequest: 3s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payment-service-resilience
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: payment-service
spec:
