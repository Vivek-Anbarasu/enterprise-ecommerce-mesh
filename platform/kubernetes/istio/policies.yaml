# Ambient mode policy.
#
# Ambient splits enforcement across TWO proxies, and the split is the thing to
# get right:
#
#   ztunnel (L4, per node)  enforces policies that TARGET a workload with a
#                            `selector`. It understands only L4 attributes:
#                            principals, namespaces, ipBlocks, ports and the
#                            source/destination conditions. An L7 attribute is
#                            not ignored - ztunnel fails safe and turns the
#                            policy into a blanket DENY. So no selector-targeted
#                            policy in this file may contain a path, method or
#                            header match.
#
#   waypoint (L7, per ns)   enforces policies ATTACHED with `targetRefs` to a
#                            Service or to the waypoint Gateway. Those are
#                            where the path and method rules live.
#
# Defence in depth, in order:
#   1. ztunnel encrypts everything in the namespace (PeerAuthentication, in
#      base/namespace.yaml).
#   2. ztunnel denies by default, and only the named principals get in.
#   3. The waypoint restricts which paths and verbs those principals may use.
---
# Deny everything not explicitly allowed. DENY policies are evaluated first, so
# an ALLOW rule can only ever narrow this further.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: default-deny
  namespace: ecommerce
spec: {}
---
# Kubelet health probes need no rule: ambient SNATs them to a link-local address
# and skips mesh policy enforcement for exactly that address, because the node
# has no identity a policy could check.
#
# The gateway is the one workload with no waypoint of its own, so its ztunnel is
# the enforcement point. Unlike every other service it is entered by something
# that has no mesh identity at all - Application Gateway for Containers runs its
# data plane outside the cluster - so it is authorized by source ADDRESS rather
# than by principal.
#
# ipBlocks is an L4 attribute, so ztunnel can enforce it. It is addressing, not
# identity, and AGC does not spoof it. Keep it in step with the
# `gateway-edge-only` NetworkPolicy in base/edge-gateway.yaml.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-edge-only
  namespace: ecommerce
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  action: ALLOW
  rules:
    - from:
        - source:
            ipBlocks:
              - "PLACEHOLDER_AGC_SUBNET_CIDR"
    - from:
        - source:
            namespaces: ["observability", "istio-system"]
---
# The waypoint has to reach the backends it balances across. Without this its
# own egress is denied and every enrolled service fails, which looks like an
# application bug and is not one.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-waypoint-egress
  namespace: ecommerce
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: waypoint
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/ecommerce/sa/ecommerce-workload"
              - "cluster.local/ns/ecommerce/sa/ecommerce-gateway"
---
# Prometheus scrapes /actuator/prometheus and Jaeger receives OTLP from every
# pod. Matching on namespace rather than principal keeps this working when the
# observability stack is deployed under a different service account.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-observability
  namespace: ecommerce
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: enterprise-ecommerce-mesh
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["observability"]
---
# One L4 policy per waypoint-enrolled service, generated from the same values
# as the `istio.io/use-waypoint` label on each Service.
#
# Once a waypoint is in the path, the destination's ztunnel sees the WAYPOINT's
# identity, not the original caller's: a waypoint does not impersonate the
# source workload. So for an enrolled service the correct L4 rule is "only the
# waypoint may reach me".
#
# That is not tidiness. `istio.io/use-waypoint` records intent, and ztunnel
# routes straight to the destination if the waypoint is missing or has no
# address. Without this rule, a waypoint outage would silently downgrade the
# service to L4 with every L7 policy unenforced and nothing in the logs to say
# so.
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: order-service-require-waypoint
  namespace: ecommerce
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/ecommerce/sa/waypoint"
    - from:
        - source:
            namespaces: ["observability", "istio-system"]
---
