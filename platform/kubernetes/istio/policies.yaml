# ---------------------------------------------------------------------------
# Telemetry.
#
# Ambient proxies emit this alongside the application's own OTel spans, so a
# trace shows queueing and mTLS handshake time that Micrometer cannot see.
# Two differences from sidecar mode that dashboards have to absorb: waypoint
# metrics carry reporter="waypoint", and there is no metrics merging, so
# Prometheus scrapes ztunnel and waypoint pods as separate targets rather than
# through the application's own /actuator/prometheus.
# ---------------------------------------------------------------------------
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: mesh-access-logging
  namespace: ecommerce
spec:
  accessLogging:
    - providers:
        - name: envoy