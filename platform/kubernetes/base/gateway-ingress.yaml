# Public entry point. Everything external enters here; nothing else is exposed.
#
# On AKS the recommended controller is the AGIC (Azure Gateway Ingress
# Controller) add-on, which fronts the cluster with an Application Gateway
# (WAF + TLS termination). If you use it, set
# `ingressClassName: azure/application-gateway` below.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: ecommerce
  annotations:
    # Application Gateway Ingress Controller is the AKS-native choice and gives
    # WAF and managed TLS in front of the gateway.
    kubernetes.azure.com/tls-cert-keyvault-uri: "PLACEHOLDER_KEYVAULT_CERT_URI"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    # Enforce TLS at the edge as well, so a plaintext request never reaches the
    # pod even if a client ignores the redirect.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-cors: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.enterprise-ecommerce.com
      secretName: api-gateway-tls
  rules:
    - host: api.enterprise-ecommerce.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
---
# Belt and braces on top of the ingress: a NetworkPolicy so that even a pod
# compromised inside the cluster cannot reach the gateway's port except through
# the ingress controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress-only
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
# Default-deny for the whole namespace. This is the control that makes an
# accidental new Service on the wrong selector fail closed rather than open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ecommerce
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Explicitly re-allow DNS, which a default-deny would otherwise break and which
# every service needs to resolve service names.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: ecommerce
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
