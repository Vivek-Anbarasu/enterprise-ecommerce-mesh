# Builds the reference manifests into an applyable set.
#
#   kubectl apply -k platform/kubernetes/base
#   kubectl -n ecommerce get deploy,svc
#
# This intentionally contains only the namespace, gateway and platform defaults.
# The ten service Deployments are generated by the Helm chart
# (deploy/helm/enterprise-ecommerce) because each needs its own secrets, probes
# and resource profile. Hand-maintaining ten near-identical Deployments is how
# they drift apart.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce

resources:
  - namespace.yaml
  - gateway.yaml
  - gateway-ingress.yaml

# `labels` with an `includeSelectors: false` default. The deprecated
# `commonLabels` field would inject these into Deployment selectors too, which
# rewrites immutable selector fields and breaks existing Deployments on upgrade.
labels:
  - pairs:
      app.kubernetes.io/part-of: enterprise-ecommerce-mesh
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

# Do NOT enable Istio sidecar injection by default: it costs memory and startup
# latency on every pod. Opt in per namespace via the `istio-injection: enabled`
# label where mTLS or traffic policy is actually required.
images:
  - name: acrenterprise.azurecr.io/ecommerce/api-gateway
    newTag: 1.0.0
