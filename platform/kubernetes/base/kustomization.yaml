# Builds the reference manifests into an applyable set.
#
#   kubectl apply -k platform/kubernetes/base
#   kubectl -n ecommerce get deploy,svc
#
# This intentionally contains only the namespace, the two edge workloads and
# platform defaults. The remaining service Deployments are generated by the Helm
# chart (deploy/helm/enterprise-ecommerce) because each needs its own secrets,
# probes and resource profile. Hand-maintaining ten near-identical Deployments is
# how they drift apart.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce

resources:
  - namespace.yaml
  - gateway.yaml
  - bff-service.yaml
  - edge-gateway.yaml

# `labels` with an `includeSelectors: false` default. The deprecated
# `commonLabels` field would inject these into Deployment selectors too, which
# rewrites immutable selector fields and breaks existing Deployments on upgrade.
labels:
  - pairs:
      app.kubernetes.io/part-of: enterprise-ecommerce-mesh
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

# Every pod in this namespace is covered by the shared per-node ztunnel via the
# `istio.io/dataplane-mode: ambient` label in namespace.yaml. There is no
# injection label and no injection webhook: nothing is injected into a pod, so
# nothing here needs one either.
#
# Layer 7 is a separate, opt-in decision made per destination Service
# (`istio.io/use-waypoint`). The overlay in platform/kubernetes/istio adds the
# waypoint and its policies.
#
# Apply both:
#   kubectl apply -k platform/kubernetes/base
#   kubectl apply -k platform/kubernetes/istio
images:
  - name: acrenterprise.azurecr.io/ecommerce/api-gateway
    newTag: 1.0.0
  - name: acrenterprise.azurecr.io/ecommerce/bff-service
    newTag: 1.0.0
