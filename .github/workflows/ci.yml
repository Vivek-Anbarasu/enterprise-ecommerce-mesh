name: CI

# The suite needs exactly one external service: MongoDB on localhost:27017.
# ai-orchestrator-service builds a MongoTemplate while its application context starts, so
# its context tests block for the server timeout and then fail without one - they do not
# degrade gracefully the way an unavailable model file does. Everything else runs without
# infrastructure: the inventory slices use H2 in PostgreSQL mode, and no test opens a Kafka
# or Redis connection, so those clients connect lazily and contexts start regardless.
#
# This is why the job carries a service container instead of being "Docker-free". One
# container, one job, ~5 minutes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Xmx2g

jobs:
  build:
    name: Build and test (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # verify, not test: it runs the full lifecycle including spring-boot:repackage,
      # so a broken repackage configuration fails here rather than at release time.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/target/*.log
            **/target/surefire-reports/*.txt
          if-no-files-found: ignore
          retention-days: 7
