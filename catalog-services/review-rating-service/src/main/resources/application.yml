server:
  port: ${SERVER_PORT:8088}
  shutdown: graceful

spring:
  application:
    name: review-rating-service
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 25s
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/reviews_db}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 1s
  # No kafka block on purpose: this service has no @KafkaListener and no EventPublisher.
  # Reviews are written through the REST API, not as events. See the note in
  # ai-orchestrator-service on why the block is absent rather than merely unused.

mesh:
  environment: ${MESH_ENV:local}
  tier: edge
  tenant:
    required: false
    default-tenant: public

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,mongo
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.enterprise.mesh: ${LOG_LEVEL_APP:INFO}
