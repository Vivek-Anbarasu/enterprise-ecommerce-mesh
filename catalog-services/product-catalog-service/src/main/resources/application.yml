server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

spring:
  application:
    name: product-catalog-service
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/catalog_db}
      auto-index-creation: false
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      lettuce:
        pool:
          max-active: 32
          min-idle: 8
  cache:
    type: redis
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:}

mesh:
  environment: ${MESH_ENV:local}
  tier: edge
  tenant:
    # Catalogue browsing is anonymous, so a tenant is optional here.
    required: false
    default-tenant: public

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,mongo
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://jaeger-collector.observability.svc.cluster.local:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.enterprise.mesh: ${LOG_LEVEL_APP:INFO}
    # Mongo query logging is noisy and can log full documents.
    org.springframework.data.mongodb.core.MongoTemplate: ${LOG_LEVEL_MONGO:INFO}
